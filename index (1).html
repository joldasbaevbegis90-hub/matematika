    h+=`<div class="c"><h2>Ko'p video qo'shish</h2><small>Har qatorga bitta: <b>havola</b> yoki <b>Nomi | havola</b>. Nom yozilmasa, YouTube'dan o'zi olinadi.</small><textarea id="bt" placeholder="https://youtu.be/xxxxxxxxxxx&#10;1-dars | https://youtu.be/yyyyyyyyyyy"></textarea><select id="bf"><option value="">Papkasiz</option>${D.f.filter(x=>x.type!=='file').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="bulkAdd()">Hammasini qo'shish</button><p id="bmsg"><small></small></p></div>`;

async function act(p){const {error}=await p;if(error)alert('Xato: '+error.message);await load();render()}

const safe=n=>n.replace(/[^\w.\-]+/g,'_');
async function upFile(){const f=fi.files[0];if(!f){alert('Fayl tanlang');return}

async function docxToText(file){

function parseTest(t,key){const ansm={};const am=t.match(/javoblar\s*:?([\s\S]*)$/i);let ks=null;

  if(ks){for(const m of ks.matchAll(/(\d+)\s*[-.):]?\s*([A-Da-d])/g))ansm[+m[1]]='ABCD'.indexOf(m[2].toUpperCase())}
  const qs=[];
  for(const b of t.split(/\n\s*(?=\d+\s*[.)]\s)/)){const m=b.trim().match(/^(\d+)\s*[.)]\s*([\s\S]*)$/);if(!m)continue;
    const body=m[2],ix=[];let pos=0;
    for(let k=0;k<4;k++){const mm=new RegExp('(^|\\s)'+'ABCD'[k]+'\\)\\s*').exec(body.slice(pos));if(!mm)break;ix.push([pos+mm.index+mm[1].length,pos+mm.index+mm[0].length]);pos+=mm.index+mm[0].length}
    if(ix.length<4)continue;
    const raws=ix.map((x,k)=>body.slice(x[1],k<3?ix[k+1][0]:undefined));
    qs.push({n:+m[1],q:body.slice(0,ix[0][0]).trim().replace(/\n{3,}/g,'\n\n'),o:raws.map((r,k)=>{const s=r.trim();return (k>0&&/\n\s*$/.test(raws[k-1]))?'\n'+s:s})})}
  return {qs,ansm}}

/* ---- animatsiya (qor, gul bargi, konfetti...) ---- */
let FX={t:null,ps:[],raf:0,c:null,x:null,w:0,h:0};
const MG=['∑','π','√','∫','≈','≠','≤','∞','±','×','÷','θ','Δ','x²'];
function fxSize(){if(!FX.c)return;const d=Math.min(window.devicePixelRatio||1,1.5);FX.w=innerWidth;FX.h=innerHeight;FX.c.width=FX.w*d;FX.c.height=FX.h*d;FX.x.setTransform(d,0,0,d,0,0)}
function fxNew(t,init){const w=FX.w,h=FX.h,R=Math.random,c=t.c[Math.floor(R()*t.c.length)];
  const p={x:R()*w,y:init?R()*h:-20,r:3,vy:1,vx:(R()-.5)*.4,rot:R()*6.28,vr:(R()-.5)*.06,ph:R()*6.28,s:.5+R()*2,col:c,g:'♥'};
  switch(t.k){
    case 'snow':p.r=1+R()*2.6;p.vy=.35+R();break;
    case 'petal':p.r=4+R()*4;p.vy=.5+R()*.8;break;
    case 'leaf':p.r=6+R()*5;p.vy=.7+R()*.9;break;
    case 'confetti':p.r=5+R()*5;p.vy=1+R()*1.4;p.vx=(R()-.5)*1.2;break;
    case 'sun':p.r=12+R()*34;p.vy=-(.12+R()*.3);p.col=c;if(!init)p.y=h+40;break;
    case 'stars':p.y=R()*h;p.r=.5+R()*1.5;p.vy=0;p.vx=0;break;
    case 'math':p.r=14+R()*14;p.vy=.3+R()*.5;p.g=MG[Math.floor(R()*MG.length)];break;
    case 'hearts':p.r=10+R()*12;p.vy=.5+R()*.7;break}
  return p}
function fxDraw(){const x=FX.x,w=FX.w,h=FX.h,t=FX.t;x.clearRect(0,0,w,h);
  if(document.querySelector('.tb'))return;
  for(const p of FX.ps){p.ph+=.02;
    if(t.k==='stars'){x.globalAlpha=.3+.7*Math.abs(Math.sin(p.ph*p.s));x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();continue}
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph)*.5;p.rot+=p.vr;
    if(p.vy>0?p.y>h+30:p.y<-60){Object.assign(p,fxNew(t,false))}
    if(p.x>w+30)p.x=-30;if(p.x<-30)p.x=w+30;
    if(t.k==='snow'){x.globalAlpha=1;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    else if(t.k==='sun'){x.globalAlpha=.35+.65*Math.abs(Math.sin(p.ph));const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba(255,214,90,.5)');g.addColorStop(1,'rgba(255,214,90,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    else{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;
      if(t.k==='petal'||t.k==='leaf'){x.globalAlpha=.85;x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.283);x.fill()}
      else if(t.k==='confetti'){x.globalAlpha=.9;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}
      else{x.globalAlpha=.5;x.font=p.r+'px sans-serif';x.textAlign='center';x.fillText(p.g,0,0)}
      x.restore()}
  }
  x.globalAlpha=1}
function fxStop(){cancelAnimationFrame(FX.raf);FX.raf=0;if(FX.c)FX.c.style.display='none'}
function fxStart(t){fxStop();FX.t=t;
  if(!t||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  if(!FX.c){FX.c=document.createElement('canvas');FX.c.id='fx';document.body.insertBefore(FX.c,document.body.firstChild);FX.x=FX.c.getContext('2d');addEventListener('resize',fxSize)}
  FX.c.style.display='block';fxSize();
  const n=Math.min(70,Math.round(FX.w*FX.h/22000)+18);
  FX.ps=Array.from({length:n},()=>fxNew(t,true));
  const loop=()=>{FX.raf=requestAnimationFrame(loop);fxDraw()};loop()}
function applyTheme(k){const t=THEMES[k]||THEMES.std,r=document.documentElement.style;
  VARS.forEach(x=>r.removeProperty('--'+x));
  if(t.v)Object.keys(t.v).forEach(x=>r.setProperty('--'+x,t.v[x]));
  let d=document.getElementById('deco');
  if(!d){d=document.createElement('div');d.id='deco';document.body.insertBefore(d,document.body.firstChild)}
  d.textContent=t.b||'';d.style.display=t.b?'block':'none';
  fxStart(t.fx||null);
  try{localStorage.setItem('thm',THEMES[k]?k:'std')}catch(e){}}
async function setTheme(k){const {error}=await sb.from('settings').upsert([{key:'theme',value:k}]);
  if(error){alert('Xato: '+error.message);return}CT=null;D.set.theme=k;applyTheme(k);render()}
const themeHtml=()=>{const cur=D.set.theme||'std';return `<div class="c"><h2>🎨 Sayt dizayni <small>(o'quvchilarda ham shu ko'rinadi)</small></h2>`+Object.keys(THEMES).map(k=>`<button class="${k===cur?'':'g'}" onclick="setTheme('${k}')">${THEMES[k].e} ${THEMES[k].n}</button>`).join('')+`</div>`};
try{applyTheme(localStorage.getItem('thm')||'std')}catch(e){}
getContacts().then(c=>{if(c&&c.theme)applyTheme(c.theme)});
