<!doctype html>
<html lang="kaa"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematika EDU</title>
<style>
:root{--bg:#f3f8f4;--card:#fff;--line:#dcebdf;--text:#1b2e23;--mute:#5f7a6a;--acc:#1f8a4c;--acc-d:#166a3a;--soft:#e6f3ea;--bgi:none;--cardo:#fff;--inp:#fbfefc;--on:#fff;--gbg:#d7f0e0;--gfg:#166a3a;--bbg:#fdeceb;--bfg:#c0392b;--bln:#e6a69f;--sh:0 2px 10px #1f8a4c0d;--blur:none}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:var(--bgi);background-attachment:fixed;background-size:cover;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.w{max-width:720px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:1}
h1{font-size:25px;font-weight:700;margin:8px 0 16px;color:var(--acc-d)}
h2{font-size:16px;font-weight:600;margin:0 0 12px;color:var(--text)}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
input,select,textarea{width:100%;padding:13px 14px;margin:5px 0;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--inp);color:var(--text);outline:none;font-family:inherit}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #1f8a4c20}
button{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;margin:6px 6px 0 0;font-family:inherit;cursor:pointer}
button:active{background:var(--acc-d)}
button.g{background:var(--soft);color:var(--acc-d)}
button.r{background:var(--inp);color:var(--bfg);border:1.5px solid var(--bln)}
a.btn{display:inline-block;background:var(--acc);color:var(--on);border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;margin:6px 6px 0 0}
a.btn:hover{text-decoration:none;background:var(--acc-d)}
a.btn.g{background:var(--soft);color:var(--acc-d)}
.t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.t button{border-radius:999px;margin:0}
.row{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.row:first-of-type{border-top:0}
.ok{color:var(--acc);font-weight:600}.no{color:var(--bfg)}
.big{font-size:26px;letter-spacing:3px;font-weight:700}
.v{position:relative;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:var(--acc);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
small{color:var(--mute)}
.op{display:block;padding:10px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}.op:has(input:checked){border-color:var(--acc);background:var(--soft)}.op input{width:auto;margin:0 6px 0 0;padding:0}.good{background:var(--gbg)!important;border-color:var(--acc)!important;color:var(--gfg)}.wrongo{background:var(--bbg)!important;border-color:var(--bln)!important;color:var(--bfg)}.bad{border-color:#e6a69f}
.qt{font-size:16px;line-height:1.7}
.ot{margin:8px 0 2px;line-height:2}
.oi{display:inline-block;margin:0 26px 0 0;padding:0 6px;border-radius:8px;border:1.5px solid transparent}
.ob{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 2px}
.ob button{width:46px;height:46px;border-radius:50%;padding:0;margin:0;background:var(--inp);color:var(--acc-d);border:2px solid var(--line);font-size:16px;font-weight:700}
.ob button.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}
.ob button.good{background:var(--gbg);color:var(--gfg);border-color:var(--acc)}
.ob button.wrongo{background:var(--bbg);color:var(--bfg);border-color:var(--bln)}
.ob button:disabled{opacity:1;cursor:default}
.tb{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.tb button{margin:0;font-size:12px;padding:9px 11px;white-space:nowrap}
.tb small{white-space:nowrap}
.katex{font-size:1.08em}
.epv{margin-top:12px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--inp)}
.st3{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sx{flex:1;min-width:92px;text-align:center;padding:12px 8px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line)}
.sx b{display:block;font-size:26px;line-height:1.2}
.sx small{display:block;font-size:13px}
.sx.g1{background:var(--gbg);border-color:var(--acc)}.sx.g1 b{color:var(--acc-d)}
.sx.r1{background:var(--bbg);border-color:var(--bln)}.sx.r1 b{color:var(--bfg)}
.mdl{position:fixed;inset:0;z-index:50;background:#0b1a1166;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--cardo);color:var(--text);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 10px 40px #0003}
.av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);font-weight:700;margin-right:10px;vertical-align:middle}
.wl{display:inline-block;min-width:34px;text-align:center;padding:2px 9px;margin:2px 4px 2px 0;border-radius:999px;background:var(--bbg);color:var(--bfg);font-weight:600;font-size:13px}.pb{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 2px}.pb i{display:block;height:100%}img.av{object-fit:cover;background:var(--soft)}#deco{display:none;text-align:center;padding:7px 10px;font-size:13px;font-weight:600;background:var(--soft);color:var(--acc-d);border-bottom:1px solid var(--line)}body{transition:background-color .3s}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#deco{position:relative;z-index:1}.bn{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 16px;box-shadow:0 2px 14px #0003}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="w" id="app"></div>

async function redeem(){
  const code=document.getElementById('code').value.trim();
  const {data,error}=await sb.rpc('redeem_code',{p_code:code,p_sid:(S()||{}).s||null,p_pin:(S()||{}).p||null});
  if(error||!data||!data.length){document.getElementById('msg').textContent="Kod qáte yamasa paydalanılǵan.";return}
  sessionStorage.setItem('cur',JSON.stringify({t:data[0].vtitle,y:data[0].vyid,i:data[0].vid,n:data[0].sname}));student();
}

async function orderByPaste(){
  const nz=t=>String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
  const blob=nz(ost.value),fid=osf.value;
  if(!blob){alert("Tekst qoyılmaǵan");return}
  const vs=D.v.filter(v=>v.folder_id===fid);
  if(!vs.length){alert("Bul papkada video joq");return}
  const pos=vs.map(v=>{const n=nz(v.title);return{v,p:n?blob.indexOf(n):-1}});
  const hit=pos.filter(x=>x.p>=0).sort((a,b)=>a.p-b.p);
  const miss=pos.filter(x=>x.p<0).sort((a,b)=>(a.v.sort_order??1e9)-(b.v.sort_order??1e9)||new Date(a.v.created_at)-new Date(b.v.created_at));
  if(!hit.length){osm.textContent="Bir de video atı tabılmadı. Playlist teksti dúrıs nusqalanbaǵan bolıwı múmkin.";return}
  const rows=[...hit,...miss].map((x,i)=>({id:x.v.id,title:x.v.title,youtube_id:x.v.youtube_id,folder_id:x.v.folder_id,sort_order:i+1}));
  const {error}=await sb.from('videos').upsert(rows);
  if(error){osm.textContent='Qáte: '+error.message;return}
  await load();render();
  alert("Tártip saqlandı: "+hit.length+" video tabıldı"+(miss.length?", "+miss.length+" video tabılmadı (olar aqırında qaldı):\n- "+miss.map(x=>x.v.title).join("\n- "):""))
}
async function importPlaylists(){
  const key=ytk.value.trim();
  const ids=[...new Set(plt.value.split('\n').map(x=>{const m=x.match(/[?&]list=([\w-]+)/);return m?m[1]:(/^(PL|UU|OL|FL)[\w-]{10,}$/.test(x.trim())?x.trim():null)}).filter(Boolean))];
  if(!key){alert("YouTube API key kiritiń");return}
  if(!ids.length){alert("Playlist siltemesi tabılmadı");return}
  try{localStorage.setItem('ytk',key)}catch(e){}
  const api=async(path,q)=>{const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+new URLSearchParams({...q,key}));const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));return j};
  const say=t=>{plmsg.textContent=t};
  let nf=0,nv=0,mv=0;
  try{
    for(let pi=0;pi<ids.length;pi++){
      const pid=ids[pi];say('Playlist '+(pi+1)+'/'+ids.length+' oqılmaqta...');
      const meta=await api('playlists',{part:'snippet',id:pid});
      if(!meta.items||!meta.items.length)throw new Error('Playlist tabılmadı: '+pid);
      const pname=meta.items[0].snippet.title;
      const items=[];let tok='';
      do{const j=await api('playlistItems',{part:'snippet,status',playlistId:pid,maxResults:50,...(tok?{pageToken:tok}:{})});
        for(const it of j.items){const y=it.snippet.resourceId&&it.snippet.resourceId.videoId;const t=it.snippet.title;
          if(!y||t==='Private video'||t==='Deleted video')continue;items.push({y,t})}
        tok=j.nextPageToken||''}while(tok);
      let fol=D.f.find(f=>f.type!=='file'&&f.name===pname);
      if(!fol){const {data,error}=await sb.from('folders').insert({name:pname}).select().single();if(error)throw error;fol=data;D.f.push(fol);nf++}
      const byY=new Map(D.v.map(v=>[v.youtube_id,v]));
      const rows=items.map((it,n)=>{const ex=byY.get(it.y);
        if(ex){mv++;return{id:ex.id,title:ex.title,youtube_id:it.y,folder_id:fol.id,sort_order:n+1}}
        nv++;return{title:it.t,youtube_id:it.y,folder_id:fol.id,sort_order:n+1}});
      const old=rows.filter(r=>r.id),neu=rows.filter(r=>!r.id);
      if(old.length){const {error}=await sb.from('videos').upsert(old);if(error)throw error}
      if(neu.length){const {error}=await sb.from('videos').insert(neu);if(error)throw error}
      const {data:vv}=await sb.from('videos').select('*');if(vv)D.v=vv;
    }
    await load();render();alert("Tayın: "+nf+" jańa papka, "+nv+" jańa video, "+mv+" bar video papkaǵa kóshirildi")
  }catch(e){say('Qáte: '+(e.message||e));alert('Qáte: '+(e.message||e))}
}
async function bulkAdd(){
  const have=new Set(D.v.map(v=>v.youtube_id));const items=[];
  for(const L of bt.value.split('\n').map(x=>x.trim()).filter(Boolean)){
    let t='',u=L;const i=L.lastIndexOf('|');if(i>-1){t=L.slice(0,i).trim();u=L.slice(i+1).trim()}
    const y=ytId(u);if(!y||have.has(y))continue;have.add(y);items.push({t,y})}
  if(!items.length){alert("Jańa dúrıs silteme tabılmadı");return}
  let done=0;
  for(let k=0;k<items.length;k+=10){
    await Promise.all(items.slice(k,k+10).map(async it=>{
      if(!it.t){try{const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+it.y));it.t=(await r.json()).title||''}catch(e){}}
      done++;bmsg.textContent='Atlar alınbaqta: '+done+'/'+items.length}))}
  const base=D.v.length;
  const rows=items.map((it,n)=>({title:it.t||('Video '+(base+n+1)),youtube_id:it.y,folder_id:bf.value||null,sort_order:base+n+1}));
  const {error}=await sb.from('videos').insert(rows);
  if(error){alert('Qáte: '+error.message);return}
  await load();render();alert(rows.length+" video qosıldı")}

const MSYM={'∞':'\\infty ','≥':'\\geq ','≤':'\\leq ','⩾':'\\geq ','⩽':'\\leq ','≠':'\\neq ','≈':'\\approx ','≡':'\\equiv ','∼':'\\sim ','±':'\\pm ','∓':'\\mp ','×':'\\times ','÷':'\\div ','·':'\\cdot ','⋅':'\\cdot ','∙':'\\cdot ','∘':'\\circ ','−':'-','–':'-','—':'-','∪':'\\cup ','∩':'\\cap ','∈':'\\in ','∉':'\\notin ','∋':'\\ni ','⊂':'\\subset ','⊃':'\\supset ','⊆':'\\subseteq ','⊇':'\\supseteq ','∅':'\\emptyset ','∀':'\\forall ','∃':'\\exists ','¬':'\\neg ','∧':'\\wedge ','∨':'\\vee ','→':'\\to ','←':'\\leftarrow ','↔':'\\leftrightarrow ','⇒':'\\Rightarrow ','⇐':'\\Leftarrow ','⇔':'\\Leftrightarrow ','∠':'\\angle ','∥':'\\parallel ','⊥':'\\perp ','△':'\\triangle ','°':'^{\\circ}','√':'\\surd ','π':'\\pi ','α':'\\alpha ','β':'\\beta ','γ':'\\gamma ','δ':'\\delta ','ε':'\\varepsilon ','θ':'\\theta ','λ':'\\lambda ','μ':'\\mu ','ρ':'\\rho ','σ':'\\sigma ','τ':'\\tau ','φ':'\\varphi ','ω':'\\omega ','ψ':'\\psi ','η':'\\eta ','ξ':'\\xi ','κ':'\\kappa ','Δ':'\\Delta ','∆':'\\Delta ','Σ':'\\Sigma ','Φ':'\\Phi ','Ω':'\\Omega ','Γ':'\\Gamma ','Θ':'\\Theta ','Λ':'\\Lambda ','Π':'\\Pi ','Ψ':'\\Psi ','ℝ':'\\mathbb{R} ','ℕ':'\\mathbb{N} ','ℤ':'\\mathbb{Z} ','ℚ':'\\mathbb{Q} ','ℂ':'\\mathbb{C} ','∂':'\\partial ','…':'\\ldots ','⋯':'\\cdots ','′':"'",'″':"''",'²':'^{2}','³':'^{3}','¹':'^{1}','⁴':'^{4}','ⁿ':'^{n}','⌊':'\\lfloor ','⌋':'\\rfloor ','⌈':'\\lceil ','⌉':'\\rceil ','∑':'\\sum ','∏':'\\prod ','∫':'\\int ','≪':'\\ll ','≫':'\\gg ','∝':'\\propto ','∶':':','∣':'|','⁄':'/'};
let MARR=false;
const mchar=ch=>{if(MSYM[ch]!==undefined)return MSYM[ch];
  switch(ch){case ' ':case '\u00a0':case '\u2009':case '\u200a':case '\u2002':case '\u2003':return '';
    case '\\':return '\\backslash ';case '{':return '\\{ ';case '}':return '\\} ';case '%':return '\\% ';case '#':return '\\# ';case '$':return '\\$ ';case '_':return '\\_ ';case '^':return '\\^{} ';case '~':return '\\sim ';case '&':return MARR?'':'\\& ';}
  return ch};
const kids=(n,nm)=>n?[...n.childNodes].filter(c=>c.nodeType===1&&c.localName===nm):[];
const kid=(n,nm)=>kids(n,nm)[0];
const mval=(n,nm,def)=>{const c=kid(n,nm);if(!c)return def;const v=c.getAttribute('m:val');return v==null?def:v};
const FN1=/^(sin|cos|tan|cot|sec|csc|log|ln|lg|lim|min|max|exp|arcsin|arccos|arctan|sinh|cosh|tanh|det|gcd)$/;
const FN2=/^(tg|ctg|arctg|arcctg|sh|ch|th|cth|sgn|tgh)$/;
const dlm=(c,beg)=>{const M={'(':'(',')':')','[':'[',']':']','{':'\\{','}':'\\}','|':'|','‖':'\\|','⌊':'\\lfloor','⌋':'\\rfloor','⌈':'\\lceil','⌉':'\\rceil','⟨':'\\langle','〈':'\\langle','⟩':'\\rangle','〉':'\\rangle','<':beg?'\\langle':'<','>':beg?'>':'\\rangle','/':'/'};return c===''?'.':(M[c]!==undefined?M[c]:'.')};
function mrun(r){
  const rp=kid(r,'rPr');let sty=null,nor=false;
  if(rp){const s=kid(rp,'sty');if(s)sty=s.getAttribute('m:val');const no=kid(rp,'nor');if(no){const v=no.getAttribute('m:val');if(v!=='0'&&v!=='false'&&v!=='off')nor=true}}
  const t=[...r.childNodes].filter(c=>c.nodeType===1&&c.localName==='t').map(c=>c.textContent).join('');
  if(!t)return '';
  if(nor)return '\\text{'+t.replace(/[\\{}$%&#_^~]/g,'')+'}';
  const tt=t.trim();
  if(FN1.test(tt))return '\\'+tt+' ';
  if(FN2.test(tt))return '\\operatorname{'+tt+'}';
  let o='';
  for(const ch of t){
    if(/[A-Za-z]/.test(ch)&&sty==='p')o+='\\mathrm{'+ch+'}';
    else if(/[A-Za-z]/.test(ch)&&sty==='b')o+='\\mathbf{'+ch+'}';
    else if(/[A-Za-z]/.test(ch)&&sty==='bi')o+='\\boldsymbol{'+ch+'}';
    else o+=mchar(ch)}
  return o}
const mk=n=>n?[...n.childNodes].filter(c=>c.nodeType===1).map(mx).join(''):'';
function mx(n){const nm=n.localName;
  if(/Pr$/.test(nm))return '';
  switch(nm){
    case 'r':return mrun(n);
    case 'f':{const ty=mval(kid(n,'fPr')||n,'type','bar');const a=mk(kid(n,'num')),b=mk(kid(n,'den'));
      return ty==='lin'?'{'+a+'}/{'+b+'}':(ty==='noBar'?'\\binom{'+a+'}{'+b+'}':'\\frac{'+a+'}{'+b+'}')}
    case 'sSup':return '{'+mk(kid(n,'e'))+'}^{'+mk(kid(n,'sup'))+'}';
    case 'sSub':return '{'+mk(kid(n,'e'))+'}_{'+mk(kid(n,'sub'))+'}';
    case 'sSubSup':return '{'+mk(kid(n,'e'))+'}_{'+mk(kid(n,'sub'))+'}^{'+mk(kid(n,'sup'))+'}';
    case 'sPre':return '{}_{'+mk(kid(n,'sub'))+'}^{'+mk(kid(n,'sup'))+'}{'+mk(kid(n,'e'))+'}';
    case 'rad':{const dg=mk(kid(n,'deg'));const hide=mval(kid(n,'radPr')||n,'degHide','0');
      return (hide==='1'||hide==='true'||hide==='on'||!dg)?'\\sqrt{'+mk(kid(n,'e'))+'}':'\\sqrt['+dg+']{'+mk(kid(n,'e'))+'}'}
    case 'd':{const pr=kid(n,'dPr');
      const b=pr?mval(pr,'begChr','('):'(',e=pr?mval(pr,'endChr',')'):')',s=pr?mval(pr,'sepChr','|'):'|';
      const parts=kids(n,'e').map(mk);
      const sep=s==='|'?'\\,\\middle|\\,':(s===''?'':s);
      return '\\left'+dlm(b,true)+' '+parts.join(sep)+' \\right'+dlm(e,false)}
    case 'eqArr':{const old=MARR;MARR=true;const rows=kids(n,'e').map(mk);MARR=old;
      return '\\begin{array}{l}'+rows.join(' \\\\ ')+'\\end{array}'}
    case 'nary':{const pr=kid(n,'naryPr');const chr=pr?mval(pr,'chr','∫'):'∫';
      const OP={'∑':'\\sum','∏':'\\prod','∫':'\\int','∬':'\\iint','∭':'\\iiint','∮':'\\oint','⋃':'\\bigcup','⋂':'\\bigcap'};
      const hs=v=>v==='1'||v==='true'||v==='on';
      const subH=pr?hs(mval(pr,'subHide','0')):false,supH=pr?hs(mval(pr,'supHide','0')):false;
      const sb2=mk(kid(n,'sub')),sp=mk(kid(n,'sup'));
      return (OP[chr]||'\\int')+(!subH&&sb2?'_{'+sb2+'}':'')+(!supH&&sp?'^{'+sp+'}':'')+' {'+mk(kid(n,'e'))+'}'}
    case 'func':return '{'+mk(kid(n,'fName'))+'}{'+mk(kid(n,'e'))+'}';
    case 'limLow':{const e=mk(kid(n,'e')),l=mk(kid(n,'lim'));return /^\\lim\s*$/.test(e)?'\\lim\\limits_{'+l+'}':'\\underset{'+l+'}{'+e+'}'}
    case 'limUpp':return '\\overset{'+mk(kid(n,'lim'))+'}{'+mk(kid(n,'e'))+'}';
    case 'acc':{const pr=kid(n,'accPr');const c=pr?mval(pr,'chr','̂'):'̂';
      const AC={'̅':'overline','¯':'overline','̄':'bar','⃗':'vec','→':'vec','̃':'tilde','~':'tilde','̇':'dot','˙':'dot','̈':'ddot','¨':'ddot','̌':'check','´':'acute','`':'grave'};
      return '\\'+(AC[c]||'hat')+'{'+mk(kid(n,'e'))+'}'}
    case 'bar':{const pr=kid(n,'barPr');const pos=pr?mval(pr,'pos','top'):'top';return (pos==='bot'?'\\underline{':'\\overline{')+mk(kid(n,'e'))+'}'}
    case 'borderBox':return '\\boxed{'+mk(kid(n,'e'))+'}';
    case 'm':return '\\begin{matrix}'+kids(n,'mr').map(mr=>kids(mr,'e').map(mk).join(' & ')).join(' \\\\ ')+'\\end{matrix}';
    default:return mk(n)}}
function wrun(r){let t='';
  for(const c of r.childNodes){if(c.nodeType!==1)continue;const n=c.localName;
    if(n==='t')t+=c.textContent;else if(n==='tab')t+='    ';else if(n==='br'||n==='cr')t+='\n';else if(n==='noBreakHyphen')t+='-'}
  const rp=[...r.childNodes].find(c=>c.nodeType===1&&c.localName==='rPr');
  const va=rp&&[...rp.childNodes].find(c=>c.nodeType===1&&c.localName==='vertAlign');
  const v=va&&va.getAttribute('w:val');
  if(t.trim()&&v==='superscript')return '$^{'+[...t].map(mchar).join('')+'}$';
  if(t.trim()&&v==='subscript')return '$_{'+[...t].map(mchar).join('')+'}$';
  return t}
/* Savol raqami ("1.") Word'da ba'zan formula ichida yoziladi: uni oddiy matn qilamiz */
/* o'nli kasr vergulida KaTeX ortiqcha bo'shliq qo'ymasin: 0,5 */
const ml=s=>s.replace(/(\d),(?=\d)/g,'$1{,}');
const qnum=c=>{const x=c.textContent.trim();return /^\d{1,3}\.$/.test(x)?x:null};
function paraText(p){let o='';
  const walk=n=>{for(const c of n.childNodes){if(c.nodeType!==1)continue;const nm=c.localName;
    if(nm==='r'&&c.namespaceURI===NS_W)o+=wrun(c);
    else if(nm==='oMathPara')o+=kids(c,'oMath').map(x=>{const q=!o.trim()&&qnum(x);return q?q+' ':'$'+ml(mk(x))+'$'}).join(' ');
    else if(nm==='oMath'){const q=!o.trim()&&qnum(c);o+=q?q+' ':'$'+ml(mk(c))+'$'}
    else if(nm==='pPr'||nm==='rPr'||nm==='del')continue;
    else walk(c)}};
  walk(p);return o}
async function docxToText(file){
  if(!window.JSZip)throw new Error("JSZip kitapxanası júklenbedi. Internetti tekserip, betti jańalań.");
  const z=await JSZip.loadAsync(await file.arrayBuffer());
  const f=z.file('word/document.xml');if(!f)throw new Error("Bul Word (.docx) fayl emes");
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error("Fayldı oqıp bolmadı");
  const body=doc.getElementsByTagNameNS(NS_W,'body')[0];
  if(!body)throw new Error("Fayl ishinde tekst tabılmadı");
  return [...body.getElementsByTagNameNS(NS_W,'p')].map(paraText).join('\n')}

/* ---------- Test matnini savollarga ajratish ---------- */
function parseTest(t,key){const ansm={};const am=t.match(/(?:javoblar|juwaplar)\s*:?([\s\S]*)$/i);let ks=null;
  if(am){ks=am[1];t=t.slice(0,am.index)}else if(key&&key.trim())ks=key;
  if(ks){for(const m of ks.matchAll(/(\d+)\s*[-.):]?\s*([A-Da-d])/g))ansm[+m[1]]='ABCD'.indexOf(m[2].toUpperCase())}
  const qs=[];
  for(const b of t.split(/\n\s*(?=\d+\s*[.)]\s)/)){const m=b.trim().match(/^(\d+)\s*[.)]\s*([\s\S]*)$/);if(!m)continue;
    const body=m[2],ix=[];let pos=0;
    for(let k=0;k<4;k++){const mm=new RegExp('(^|\\s)'+'ABCD'[k]+'\\)\\s*').exec(body.slice(pos));if(!mm)break;ix.push([pos+mm.index+mm[1].length,pos+mm.index+mm[0].length]);pos+=mm.index+mm[0].length}
    if(ix.length<4)continue;
    const raws=ix.map((x,k)=>body.slice(x[1],k<3?ix[k+1][0]:undefined));
    qs.push({n:+m[1],q:body.slice(0,ix[0][0]).trim().replace(/\n{3,}/g,'\n\n'),o:raws.map((r,k)=>{const s=r.trim();return (k>0&&/\n\s*$/.test(raws[k-1]))?'\n'+s:s})})}
  return {qs,ansm}}
let pvt;
const previewSoon=()=>{clearTimeout(pvt);pvt=setTimeout(previewTest,500)};
function previewTest(){
  const el=document.getElementById('tpv');if(!el)return;
  if(!tx.value.trim()){el.innerHTML='';return}
  const {qs,ansm}=parseTest(tx.value,tak.value);
  if(!qs.length){el.innerHTML='';tfm.textContent="Sorawlar tabılmadı. Format: 1. Soraw A) ... B) ... C) ... D) ...";return}
  const miss=qs.filter(q=>!(q.n in ansm)).map(q=>q.n);
  tfm.textContent=qs.length+" soraw tabıldı. "+(miss.length?"Juwabı joq: "+miss.join(', ')+" (tómendegi \"Dúrıs juwaplar\" katagine jazıń).":"Juwaplar tabıldı.");
  el.innerHTML='<h2 style="margin:18px 4px 0">👁 Oqıwshıda bılay kórinedi <small>(jasıl dóńgelek = dúrıs juwap)</small></h2>'+qs.map((q,i)=>qBlock(q,i,true,ansm[q.n])).join('');
  kx(el)}
async function readTestFile(inp){
  const f=inp.files[0];if(!f)return;
  tfm.textContent="Fayl oqılbaqta...";
  try{let t='';
    if(/\.docx$/i.test(f.name))t=await docxToText(f);
    else if(/\.txt$/i.test(f.name))t=await f.text();
    else{tfm.textContent="Tek .docx yamasa .txt fayl tańlań (eski .doc islemeydi).";return}
    tx.value=t.replace(/\r/g,'').replace(/\u00a0/g,' ').trim();
    if(!tn.value.trim())tn.value=f.name.replace(/\.[^.]+$/,'');
    previewTest();
    if(!tx.value)tfm.textContent="Faylda tekst tabılmadı"
  }catch(e){tfm.textContent='Qáte: '+e.message}}
async function saveTest(){const {qs,ansm}=parseTest(tx.value,tak.value);
  if(!qs.length){tmsg.textContent='Sorawlar tabılmadı';return}
  const miss=qs.filter(q=>!(q.n in ansm)).map(q=>q.n);
  if(miss.length){tmsg.textContent="Juwabı joq: "+miss.join(', ')+". \"Dúrıs juwaplar\" katagine jazıń (mısalı: 1C 2B 3A).";return}
  const mn=parseInt(tm2.value);if(!mn||mn<1){tmsg.textContent="Test waqtın (minut) kiritiń";return}
  const {data,error}=await sb.from('tests').insert({video_id:tv.value,title:tn.value.trim()||'Test',minutes:mn,qs:qs.map(({q,o})=>({q,o}))}).select().single();
  if(error){alert('Qáte: '+error.message);return}
  const k=await sb.from('test_keys').insert({test_id:data.id,ans:qs.map(q=>ansm[q.n])});
  if(k.error){alert('Qáte: '+k.error.message);return}
  await load();render();alert(qs.length+" soraw saqlandı")}
function chTime(id,m){const v=prompt("Jańa waqıt (minut):",m);const n=parseInt(v);if(!n||n<1)return;act(sb.from('tests').update({minutes:n}).eq('id',id))}

   <small>Dúrıs juwap:</small><div class="ob">${[0,1,2,3].map(j=>`<button type="button" id="ea${i}_${j}" class="${E.ans[i]===j?'sel':''}" onclick="eA(${i},${j})">${'ABCD'[j]}</button>`).join('')}</div>

  `<div class="c"><button class="g" onclick="eAdd()">+ Soraw qosıw</button><button onclick="eSave()">💾 Saqlaw</button><p id="emsg" class="no"></p></div>`}
async function eSave(){eMeta();const m=document.getElementById('emsg');
  const mn=parseInt(E.minutes);
  if(!E.title.trim()){m.textContent='Test atın jazıń';return}
  if(!mn||mn<1){m.textContent='Waqıttı (minut) kiritiń';return}
  if(!E.qs.length){m.textContent="Keminde bir soraw bolsın";return}
  for(let i=0;i<E.qs.length;i++){const q=E.qs[i];
    if(!q.q.trim()){m.textContent=(i+1)+"-soraw teksti bos";return}
    const k=q.o.findIndex(t=>!t.trim());if(k>=0){m.textContent=(i+1)+"-sorawda "+'ABCD'[k]+"varianti bos";return}
    if(E.ans[i]==null){m.textContent=(i+1)+"-sorawdıń dúrıs juwabı belgilenbegen";return}}
  if(D.rr.some(r=>r.test_id===E.id)&&!confirm("Bul testti oqıwshılar islegen. Sorawlardı ózgertseńiz, eski nátiyjeler eski sorawlarǵa tiyisli bolıp qaladı. Dawam etesizbe?"))return;
  m.textContent='Saqlanbaqta...';
  const qs=E.qs.map(x=>({q:x.q.trim(),o:x.o.map((t,k)=>(x.nl[k]?'\n':'')+t.trim())}));
  const r1=await sb.from('tests').update({title:E.title.trim(),minutes:mn,video_id:E.video_id,qs}).eq('id',E.id);
  if(r1.error){m.textContent='Qáte: '+r1.error.message;return}
  const u=await sb.from('test_keys').update({ans:E.ans}).eq('test_id',E.id).select();
  if(u.error){m.textContent='Qáte: '+u.error.message;return}
  if(!u.data||!u.data.length){const i2=await sb.from('test_keys').insert({test_id:E.id,ans:E.ans});if(i2.error){m.textContent='Qáte: '+i2.error.message;return}}
  await load();tab='tests';render();alert('Saqlandı')}

function testsHtml(){
  let h=`<div class="c"><h2>Jańa test</h2><select id="tv">${D.v.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('')}</select><input id="tn" placeholder="Test atı">

function applyTheme(k){const t=THEMES[k]||THEMES.std,r=document.documentElement.style;
  VARS.forEach(x=>r.removeProperty('--'+x));
  if(t.v)Object.keys(t.v).forEach(x=>r.setProperty('--'+x,t.v[x]));
  try{localStorage.setItem('thm',THEMES[k]?k:'std')}catch(e){}}
async function setTheme(k){const {error}=await sb.from('settings').upsert([{key:'theme',value:k}]);
  if(error){alert('Xato: '+error.message);return}CT=null;D.set.theme=k;applyTheme(k);render()}
const themeHtml=()=>{const cur=D.set.theme||'std';return `<div class="c"><h2>🎨 Sayt dizayni <small>(oqıwshılarda da usı kórinedi)</small></h2>`+Object.keys(THEMES).map(k=>`<button class="${k===cur?'':'g'}" onclick="setTheme('${k}')">${THEMES[k].e} ${THEMES[k].n}</button>`).join('')+`</div>`};
try{applyTheme(localStorage.getItem('thm')||'std')}catch(e){}
