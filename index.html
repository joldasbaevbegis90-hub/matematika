<!doctype html>
<html lang="kaa"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematika EDU</title>
<style>
:root{
  --bg:#0b1120; --card:rgba(30,41,59,0.85); --line:#334155; --text:#f8fafc;
  --mute:#94a3b8; --acc:#3b82f6; --acc-d:#2563eb; --soft:#1e293b;
  --bgi:none; --cardo:#1e293b; --inp:#0f172a; --on:#ffffff;
  --gbg:#064e3b; --gfg:#34d399; --bbg:#7f1d1d; --bfg:#f87171; --bln:#991b1b;
  --sh:0 8px 32px rgba(0,0,0,0.4); --blur:blur(12px);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background-color:var(--bg); background-image:radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
  background-attachment:fixed; color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:80px;
}
.w{max-width:720px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:1}
h1{font-size:25px;font-weight:700;margin:8px 0 16px;color:var(--text)}
h2{font-size:16px;font-weight:600;margin:0 0 12px;color:var(--text)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
input,select,textarea{width:100%;padding:14px 16px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;background:var(--inp);color:var(--text);outline:none;font-family:inherit}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,0.2)}
button{background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;margin:6px 6px 0 0;font-family:inherit;cursor:pointer;transition:background .2s}
button:active{background:var(--acc-d)}
button.g{background:var(--soft);color:var(--text)}
button.r{background:var(--inp);color:var(--bfg);border:1px solid var(--bln)}
a.btn{display:inline-block;background:var(--acc);color:var(--on);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;margin:6px 6px 0 0;text-decoration:none}
a.btn:hover{text-decoration:none;background:var(--acc-d)}
a.btn.g{background:var(--soft);color:var(--text)}
.t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.t button{border-radius:99px;margin:0;padding:8px 16px;font-size:13px}
.row{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.row:first-of-type{border-top:0}
.ok{color:var(--gfg);font-weight:600}.no{color:var(--bfg)}
.big{font-size:26px;letter-spacing:3px;font-weight:700}
.v{position:relative;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:var(--acc);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
small{color:var(--mute)}
.op{display:block;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:all .2s;background:var(--inp)}
.op:has(input:checked){border-color:var(--acc);background:rgba(59,130,246,0.1)}
.op input{width:auto;margin:0 8px 0 0;padding:0}
.good{background:var(--gbg)!important;border-color:var(--acc)!important;color:var(--gfg)}
.wrongo{background:var(--bbg)!important;border-color:var(--bln)!important;color:var(--bfg)}
.bad{border-color:var(--bfg)}
.qt{font-size:16px;line-height:1.7}
.ot{margin:8px 0 2px;line-height:2}
.oi{display:inline-block;margin:0 26px 0 0;padding:0 6px;border-radius:8px;border:1.5px solid transparent}
.ob{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 2px}
.ob button{width:46px;height:46px;border-radius:50%;padding:0;margin:0;background:var(--inp);color:var(--text);border:2px solid var(--line);font-size:16px;font-weight:700}
.ob button.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}
.ob button.good{background:var(--gbg);color:var(--gfg);border-color:var(--acc)}
.ob button.wrongo{background:var(--bbg);color:var(--bfg);border-color:var(--bln)}
.ob button:disabled{opacity:1;cursor:default}
.tb{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-radius:14px;border:1px solid var(--line);backdrop-filter:var(--blur)}
.tb button{margin:0;font-size:12px;padding:9px 11px;white-space:nowrap}
.tb small{white-space:nowrap}
.katex{font-size:1.08em}
.epv{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:var(--inp)}
.st3{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sx{flex:1;min-width:92px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
.sx b{display:block;font-size:26px;line-height:1.2}
.sx small{display:block;font-size:13px}
.sx.g1{background:var(--gbg);border-color:var(--acc)}.sx.g1 b{color:var(--gfg)}
.sx.r1{background:var(--bbg);border-color:var(--bln)}.sx.r1 b{color:var(--bfg)}
.mdl{position:fixed;inset:0;z-index:50;background:rgba(11,17,32,0.8);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.mb{background:var(--cardo);color:var(--text);border-radius:24px 24px 0 0;padding:24px;max-width:600px;width:100%;box-shadow:0 -10px 40px rgba(0,0,0,0.5);backdrop-filter:var(--blur);border:1px solid var(--line)}
.av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--on);font-weight:700;margin-right:10px;vertical-align:middle}
.wl{display:inline-block;min-width:34px;text-align:center;padding:2px 10px;margin:2px 4px 2px 0;border-radius:99px;background:var(--bbg);color:var(--bfg);font-weight:600;font-size:13px}
.pb{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.pb i{display:block;height:100%;background:var(--acc);border-radius:99px}
img.av{object-fit:cover;background:var(--soft)}
#deco{display:none;text-align:center;padding:8px 10px;font-size:13px;font-weight:600;background:var(--soft);color:var(--acc);border-bottom:1px solid var(--line);position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bn{display:block;width:100%;height:auto;border-radius:16px;margin:0 0 16px;box-shadow:var(--sh)}

/* Bottom Navigation */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:var(--blur);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--mute);font-size:11px;font-weight:500;text-decoration:none;gap:4px;transition:color 0.2s}
.nav-item.active{color:var(--acc)}
.nav-item span{font-size:20px}
</style>
