}
const vt=id=>(D.v.find(x=>x.id===id)||{}).title||'?';
function render(){
  const tabs=[['videos','Videolar'],['codes','Kodlar'],['files','Fayllar'],['stats','Statistika'],['acc','Hisob'],['tests','Testlar'],['qs','Savollar'],['stu',"O'quvchilar"]];
  const on=t=>tab===t||(tab==='stuone'&&t==='stu')||(tab==='edit'&&t==='tests');
  let h=`<h1>Ustoz kabineti</h1><div class="t">${tabs.map(t=>`<button class="${on(t[0])?'':'g'}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
  if(tab==='videos'){
    h+=`<div class="c"><h2>Yangi papka</h2><input id="fn" placeholder="Papka nomi (masalan: Algebra 9-sinf)"><button onclick="addFolder()">Papka qo'shish</button></div>
    <div class="c"><h2>Video qo'shish</h2><input id="vtt" placeholder="Video nomi"><input id="vl" placeholder="YouTube havolasi"><select id="vf"><option value="">Papkasiz</option>${D.f.filter(x=>x.type!=='file').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="addVideo()">Qo'shish</button></div>`;
    h+=`<div class="c"><h2>Ko'p video qo'shish</h2><small>Har qatorga bitta: <b>havola</b> yoki <b>Nomi | havola</b>. Nom yozilmasa, YouTube'dan o'zi olinadi.</small><textarea id="bt" placeholder="https://youtu.be/xxxxxxxxxxx&#10;1-dars | https://youtu.be/yyyyyyyyyyy"></textarea><select id="bf"><option value="">Papkasiz</option>${D.f.filter(x=>x.type!=='file').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="bulkAdd()">Hammasini qo'shish</button><p id="bmsg"><small></small></p></div>`;
    const groups=[...D.f.filter(f=>f.type!=='file').map(f=>[f.id,f.name]),['','Papkasiz']];
    groups.forEach(([fid,fname])=>{const vs=D.v.filter(v=>(v.folder_id||'')===fid);if(!vs.length&&!fid)return;
      h+=`<div class="c"><h2>📁 ${esc(fname)} ${fid?`<button class="r" style="padding:4px 10px;float:right;margin:0" onclick="delFolder('${fid}')">✕</button>`:''}</h2>`+
      (vs.length?vs.map(v=>`<div class="row"><b>${esc(v.title)}</b><br><button onclick="mkCode('${v.id}')">+ Kod</button><button class="g" onclick="repl('${v.id}')">Almashtirish</button><button class="r" onclick="delVideo('${v.id}')">O'chirish</button></div>`).join(''):'<small>Bo\'sh</small>')+`</div>`});
  }

  }
  if(tab==='stats'){
    h+=`<div class="c"><h2>Kim nimani ko'rgan</h2>`+(D.l.length?D.l.map(l=>`<div class="row"><b>${esc(l.student_name||'Ismsiz')}</b> — ${esc(vt(l.video_id))}<br><small>${fmt(l.started_at)}</small></div>`).join(''):'<small>Hali ko\'rish yo\'q.</small>')+`</div>
    <div class="c"><h2>Videolar bo'yicha</h2>${D.v.map(v=>`<div class="row">${esc(v.title)}: <b>${D.l.filter(l=>l.video_id===v.id).length}</b> marta</div>`).join('')}</div>`;
  }
  if(tab==='acc'){
    h+=`<div class="c"><h2>Ustoz bilan bog'lanish <small>(o'quvchilar sahifasida tugma bo'lib chiqadi)</small></h2><input id="ctg" placeholder="Telegram: @username" value="${esc(D.set.tg||'')}"><input id="cph" placeholder="Telefon: +998901234567" value="${esc(D.set.phone||'')}"><button onclick="saveContacts()">Saqlash</button></div>

    <button class="r" onclick="logout()">Chiqish</button>`;
  }

    h+=`<div class="c"><h2>Yangi fayl papkasi</h2><input id="ffn" placeholder="Papka nomi (masalan: Testlar 9-sinf)"><button onclick="addFFolder()">Papka qo'shish</button></div>
    <div class="c"><h2>Fayl yuklash</h2><input id="ft" placeholder="Nomi (ixtiyoriy)"><select id="fk"><option value="file">Fayl</option><option value="test">Test</option></select><select id="ffo"><option value="">Papkasiz</option>${ff.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input id="fi" type="file"><button onclick="upFile()">Yuklash</button><p id="fmsg"><small>Bitta fayl 50 MB gacha.</small></p></div>`;
    [...ff.map(f=>[f.id,f.name]),['','Papkasiz']].forEach(([fid,fname])=>{const xs=D.fl.filter(x=>(x.folder_id||'')===fid);if(!xs.length&&!fid)return;
      h+=`<div class="c"><h2>📁 ${esc(fname)} ${fid?`<button class="r" style="padding:4px 10px;float:right;margin:0" onclick="delFolder('${fid}')">✕</button>`:''}</h2>`+
      (xs.length?xs.map(x=>`<div class="row"><b>${esc(x.title)}</b> <small>${x.kind==='test'?'Test':'Fayl'} · ${fmt(x.created_at)}</small><br><button onclick="openFile('${x.id}')">Ochish</button><button class="g" onclick="replFile('${x.id}')">Almashtirish</button><button class="r" onclick="delFile('${x.id}')">O'chirish</button></div>`).join(''):'<small>Bo\'sh</small>')+`</div>`});

async function act(p){const {error}=await p;if(error)alert('Xato: '+error.message);await load();render()}
function addFolder(){if(!fn.value.trim())return;act(sb.from('folders').insert({name:fn.value.trim()}))}
function delFolder(id){if(confirm("Papka o'chirilsinmi? Videolar papkasiz qoladi."))act(sb.from('folders').delete().eq('id',id))}
function addVideo(){const y=ytId(vl.value);if(!vtt.value.trim()||!y){alert("Nom va to'g'ri YouTube havolasini kiriting");return}
  act(sb.from('videos').insert({title:vtt.value.trim(),youtube_id:y,folder_id:vf.value||null}))}
function repl(id){const u=prompt("Yangi YouTube havolasi:");const y=ytId(u);if(!y){alert("Havola noto'g'ri");return}act(sb.from('videos').update({youtube_id:y}).eq('id',id))}
function delVideo(id){if(confirm("Video o'chirilsinmi?"))act(sb.from('videos').delete().eq('id',id))}
async function mkCode(vid){const n=prompt("O'quvchi ismi (ixtiyoriy):")??null;if(n===null&&!confirm("Ismsiz kod yaratilsinmi?"))return;
  const code=gen();const {error}=await sb.from('access_codes').insert({video_id:vid,code,student_name:n||null});
  if(error){alert('Xato: '+error.message);return}await load();tab='codes';render();alert('Kod: '+code)}
function delCode(id){act(sb.from('access_codes').delete().eq('id',id))}
async function upd(o){const {error}=await sb.auth.updateUser(o);alert(error?'Xato: '+error.message:'Saqlandi')}
async function saveContacts(){const {error}=await sb.from('settings').upsert([{key:'tg',value:ctg.value.trim()},{key:'phone',value:cph.value.trim()}]);
  if(error){alert('Xato: '+error.message);return}CT=null;await load();render();alert('Saqlandi')}
function addFFolder(){if(!ffn.value.trim())return;act(sb.from('folders').insert({name:ffn.value.trim(),type:'file'}))}
const safe=n=>n.replace(/[^\w.\-]+/g,'_');
async function upFile(){const f=fi.files[0];if(!f){alert('Fayl tanlang');return}
  fmsg.textContent='Yuklanmoqda...';
  const path=crypto.randomUUID()+'/'+safe(f.name);
  const {error}=await sb.storage.from('files').upload(path,f);
  if(error){fmsg.textContent='Xato: '+error.message;return}
  await act(sb.from('files').insert({title:ft.value.trim()||f.name,file_url:path,kind:fk.value,folder_id:ffo.value||null}))}
async function openFile(id){const x=D.fl.find(a=>a.id===id);const w=window.open('','_blank');
  const {data,error}=await sb.storage.from('files').createSignedUrl(x.file_url,3600);
  if(error){if(w)w.close();alert('Xato: '+error.message);return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
function replFile(id){const x=D.fl.find(a=>a.id===id);const i=document.createElement('input');i.type='file';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;const path=crypto.randomUUID()+'/'+safe(f.name);
    const u=await sb.storage.from('files').upload(path,f);if(u.error){alert('Xato: '+u.error.message);return}
    await sb.storage.from('files').remove([x.file_url]);
    act(sb.from('files').update({file_url:path}).eq('id',id))};i.click()}
function delFile(id){const x=D.fl.find(a=>a.id===id);if(!confirm("Fayl o'chirilsinmi?"))return;
  sb.storage.from('files').remove([x.file_url]).then(()=>act(sb.from('files').delete().eq('id',id)))}
async function bulkAdd(){
  const have=new Set(D.v.map(v=>v.youtube_id));const items=[];
  for(const L of bt.value.split('\n').map(x=>x.trim()).filter(Boolean)){
    let t='',u=L;const i=L.lastIndexOf('|');if(i>-1){t=L.slice(0,i).trim();u=L.slice(i+1).trim()}
    const y=ytId(u);if(!y||have.has(y))continue;have.add(y);items.push({t,y})}
  if(!items.length){alert("Yangi to'g'ri havola topilmadi");return}
  let done=0;
  for(let k=0;k<items.length;k+=10){
    await Promise.all(items.slice(k,k+10).map(async it=>{
      if(!it.t){try{const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+it.y));it.t=(await r.json()).title||''}catch(e){}}
      done++;bmsg.textContent='Nomlar olinmoqda: '+done+'/'+items.length}))}
  const base=D.v.length;
  const rows=items.map((it,n)=>({title:it.t||('Video '+(base+n+1)),youtube_id:it.y,folder_id:bf.value||null,sort_order:base+n+1}));
  const {error}=await sb.from('videos').insert(rows);
  if(error){alert('Xato: '+error.message);return}
  await load();render();alert(rows.length+" ta video qo'shildi")}

/* ---------- WORD (.docx) ni o'qish: matn + formulalar (OMML -> LaTeX) ---------- */
const NS_W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const MSYM={'∞':'\\infty ','≥':'\\geq ','≤':'\\leq ','⩾':'\\geq ','⩽':'\\leq ','≠':'\\neq ','≈':'\\approx ','≡':'\\equiv ','∼':'\\sim ','±':'\\pm ','∓':'\\mp ','×':'\\times ','÷':'\\div ','·':'\\cdot ','⋅':'\\cdot ','∙':'\\cdot ','∘':'\\circ ','−':'-','–':'-','—':'-','∪':'\\cup ','∩':'\\cap ','∈':'\\in ','∉':'\\notin ','∋':'\\ni ','⊂':'\\subset ','⊃':'\\supset ','⊆':'\\subseteq ','⊇':'\\supseteq ','∅':'\\emptyset ','∀':'\\forall ','∃':'\\exists ','¬':'\\neg ','∧':'\\wedge ','∨':'\\vee ','→':'\\to ','←':'\\leftarrow ','↔':'\\leftrightarrow ','⇒':'\\Rightarrow ','⇐':'\\Leftarrow ','⇔':'\\Leftrightarrow ','∠':'\\angle ','∥':'\\parallel ','⊥':'\\perp ','△':'\\triangle ','°':'^{\\circ}','√':'\\surd ','π':'\\pi ','α':'\\alpha ','β':'\\beta ','γ':'\\gamma ','δ':'\\delta ','ε':'\\varepsilon ','θ':'\\theta ','λ':'\\lambda ','μ':'\\mu ','ρ':'\\rho ','σ':'\\sigma ','τ':'\\tau ','φ':'\\varphi ','ω':'\\omega ','ψ':'\\psi ','η':'\\eta ','ξ':'\\xi ','κ':'\\kappa ','Δ':'\\Delta ','∆':'\\Delta ','Σ':'\\Sigma ','Φ':'\\Phi ','Ω':'\\Omega ','Γ':'\\Gamma ','Θ':'\\Theta ','Λ':'\\Lambda ','Π':'\\Pi ','Ψ':'\\Psi ','ℝ':'\\mathbb{R} ','ℕ':'\\mathbb{N} ','ℤ':'\\mathbb{Z} ','ℚ':'\\mathbb{Q} ','ℂ':'\\mathbb{C} ','∂':'\\partial ','…':'\\ldots ','⋯':'\\cdots ','′':"'",'″':"''",'²':'^{2}','³':'^{3}','¹':'^{1}','⁴':'^{4}','ⁿ':'^{n}','⌊':'\\lfloor ','⌋':'\\rfloor ','⌈':'\\lceil ','⌉':'\\rceil ','∑':'\\sum ','∏':'\\prod ','∫':'\\int ','≪':'\\ll ','≫':'\\gg ','∝':'\\propto ','∶':':','∣':'|','⁄':'/'};
let MARR=false;
const mchar=ch=>{if(MSYM[ch]!==undefined)return MSYM[ch];
  switch(ch){case ' ':case '\u00a0':case '\u2009':case '\u200a':case '\u2002':case '\u2003':return '';
    case '\\':return '\\backslash ';case '{':return '\\{ ';case '}':return '\\} ';case '%':return '\\% ';case '#':return '\\# ';case '$':return '\\$ ';case '_':return '\\_ ';case '^':return '\\^{} ';case '~':return '\\sim ';case '&':return MARR?'':'\\& ';}
  return ch};
const kids=(n,nm)=>n?[...n.childNodes].filter(c=>c.nodeType===1&&c.localName===nm):[];
const kid=(n,nm)=>kids(n,nm)[0];
const mval=(n,nm,def)=>{const c=kid(n,nm);if(!c)return def;const v=c.getAttribute('m:val');return v==null?def:v};
const FN1=/^(sin|cos|tan|cot|sec|csc|log|ln|lg|lim|min|max|exp|arcsin|arccos|arctan|sinh|cosh|tanh|det|gcd)$/;
const FN2=/^(tg|ctg|arctg|arcctg|sh|ch|th|cth|sgn|tgh)$/;
const dlm=(c,beg)=>{const M={'(':'(',')':')','[':'[',']':']','{':'\\{','}':'\\}','|':'|','‖':'\\|','⌊':'\\lfloor','⌋':'\\rfloor','⌈':'\\lceil','⌉':'\\rceil','⟨':'\\langle','〈':'\\langle','⟩':'\\rangle','〉':'\\rangle','<':beg?'\\langle':'<','>':beg?'>':'\\rangle','/':'/'};return c===''?'.':(M[c]!==undefined?M[c]:'.')};
function mrun(r){
  const rp=kid(r,'rPr');let sty=null,nor=false;
  if(rp){const s=kid(rp,'sty');if(s)sty=s.getAttribute('m:val');const no=kid(rp,'nor');if(no){const v=no.getAttribute('m:val');if(v!=='0'&&v!=='false'&&v!=='off')nor=true}}
  const t=[...r.childNodes].filter(c=>c.nodeType===1&&c.localName==='t').map(c=>c.textContent).join('');
  if(!t)return '';
  if(nor)return '\\text{'+t.replace(/[\\{}$%&#_^~]/g,'')+'}';
  const tt=t.trim();
  if(FN1.test(tt))return '\\'+tt+' ';
  if(FN2.test(tt))return '\\operatorname{'+tt+'}';
  let o='';
  for(const ch of t){
    if(/[A-Za-z]/.test(ch)&&sty==='p')o+='\\mathrm{'+ch+'}';
    else if(/[A-Za-z]/.test(ch)&&sty==='b')o+='\\mathbf{'+ch+'}';
    else if(/[A-Za-z]/.test(ch)&&sty==='bi')o+='\\boldsymbol{'+ch+'}';
    else o+=mchar(ch)}
  return o}
const mk=n=>n?[...n.childNodes].filter(c=>c.nodeType===1).map(mx).join(''):'';
function mx(n){const nm=n.localName;
  if(/Pr$/.test(nm))return '';
  switch(nm){
    case 'r':return mrun(n);
    case 'f':{const ty=mval(kid(n,'fPr')||n,'type','bar');const a=mk(kid(n,'num')),b=mk(kid(n,'den'));
      return ty==='lin'?'{'+a+'}/{'+b+'}':(ty==='noBar'?'\\binom{'+a+'}{'+b+'}':'\\frac{'+a+'}{'+b+'}')}
    case 'sSup':return '{'+mk(kid(n,'e'))+'}^{'+mk(kid(n,'sup'))+'}';
    case 'sSub':return '{'+mk(kid(n,'e'))+'}_{'+mk(kid(n,'sub'))+'}';
    case 'sSubSup':return '{'+mk(kid(n,'e'))+'}_{'+mk(kid(n,'sub'))+'}^{'+mk(kid(n,'sup'))+'}';
    case 'sPre':return '{}_{'+mk(kid(n,'sub'))+'}^{'+mk(kid(n,'sup'))+'}{'+mk(kid(n,'e'))+'}';
    case 'rad':{const dg=mk(kid(n,'deg'));const hide=mval(kid(n,'radPr')||n,'degHide','0');
      return (hide==='1'||hide==='true'||hide==='on'||!dg)?'\\sqrt{'+mk(kid(n,'e'))+'}':'\\sqrt['+dg+']{'+mk(kid(n,'e'))+'}'}
    case 'd':{const pr=kid(n,'dPr');
      const b=pr?mval(pr,'begChr','('):'(',e=pr?mval(pr,'endChr',')'):')',s=pr?mval(pr,'sepChr','|'):'|';
      const parts=kids(n,'e').map(mk);
      const sep=s==='|'?'\\,\\middle|\\,':(s===''?'':s);
      return '\\left'+dlm(b,true)+' '+parts.join(sep)+' \\right'+dlm(e,false)}
    case 'eqArr':{const old=MARR;MARR=true;const rows=kids(n,'e').map(mk);MARR=old;
      return '\\begin{array}{l}'+rows.join(' \\\\ ')+'\\end{array}'}
    case 'nary':{const pr=kid(n,'naryPr');const chr=pr?mval(pr,'chr','∫'):'∫';
      const OP={'∑':'\\sum','∏':'\\prod','∫':'\\int','∬':'\\iint','∭':'\\iiint','∮':'\\oint','⋃':'\\bigcup','⋂':'\\bigcap'};
      const hs=v=>v==='1'||v==='true'||v==='on';
      const subH=pr?hs(mval(pr,'subHide','0')):false,supH=pr?hs(mval(pr,'supHide','0')):false;
      const sb2=mk(kid(n,'sub')),sp=mk(kid(n,'sup'));
      return (OP[chr]||'\\int')+(!subH&&sb2?'_{'+sb2+'}':'')+(!supH&&sp?'^{'+sp+'}':'')+' {'+mk(kid(n,'e'))+'}'}
    case 'func':return '{'+mk(kid(n,'fName'))+'}{'+mk(kid(n,'e'))+'}';
    case 'limLow':{const e=mk(kid(n,'e')),l=mk(kid(n,'lim'));return /^\\lim\s*$/.test(e)?'\\lim\\limits_{'+l+'}':'\\underset{'+l+'}{'+e+'}'}
    case 'limUpp':return '\\overset{'+mk(kid(n,'lim'))+'}{'+mk(kid(n,'e'))+'}';
    case 'acc':{const pr=kid(n,'accPr');const c=pr?mval(pr,'chr','̂'):'̂';
      const AC={'̅':'overline','¯':'overline','̄':'bar','⃗':'vec','→':'vec','̃':'tilde','~':'tilde','̇':'dot','˙':'dot','̈':'ddot','¨':'ddot','̌':'check','´':'acute','`':'grave'};
      return '\\'+(AC[c]||'hat')+'{'+mk(kid(n,'e'))+'}'}
    case 'bar':{const pr=kid(n,'barPr');const pos=pr?mval(pr,'pos','top'):'top';return (pos==='bot'?'\\underline{':'\\overline{')+mk(kid(n,'e'))+'}'}
    case 'borderBox':return '\\boxed{'+mk(kid(n,'e'))+'}';
    case 'm':return '\\begin{matrix}'+kids(n,'mr').map(mr=>kids(mr,'e').map(mk).join(' & ')).join(' \\\\ ')+'\\end{matrix}';
    default:return mk(n)}}
function wrun(r){let t='';
  for(const c of r.childNodes){if(c.nodeType!==1)continue;const n=c.localName;
    if(n==='t')t+=c.textContent;else if(n==='tab')t+='    ';else if(n==='br'||n==='cr')t+='\n';else if(n==='noBreakHyphen')t+='-'}
  const rp=[...r.childNodes].find(c=>c.nodeType===1&&c.localName==='rPr');
  const va=rp&&[...rp.childNodes].find(c=>c.nodeType===1&&c.localName==='vertAlign');
  const v=va&&va.getAttribute('w:val');
  if(t.trim()&&v==='superscript')return '$^{'+[...t].map(mchar).join('')+'}$';
  if(t.trim()&&v==='subscript')return '$_{'+[...t].map(mchar).join('')+'}$';
  return t}
/* Savol raqami ("1.") Word'da ba'zan formula ichida yoziladi: uni oddiy matn qilamiz */
/* o'nli kasr vergulida KaTeX ortiqcha bo'shliq qo'ymasin: 0,5 */
const ml=s=>s.replace(/(\d),(?=\d)/g,'$1{,}');
const qnum=c=>{const x=c.textContent.trim();return /^\d{1,3}\.$/.test(x)?x:null};
function paraText(p){let o='';
  const walk=n=>{for(const c of n.childNodes){if(c.nodeType!==1)continue;const nm=c.localName;
    if(nm==='r'&&c.namespaceURI===NS_W)o+=wrun(c);
    else if(nm==='oMathPara')o+=kids(c,'oMath').map(x=>{const q=!o.trim()&&qnum(x);return q?q+' ':'$'+ml(mk(x))+'$'}).join(' ');
    else if(nm==='oMath'){const q=!o.trim()&&qnum(c);o+=q?q+' ':'$'+ml(mk(c))+'$'}
    else if(nm==='pPr'||nm==='rPr'||nm==='del')continue;
    else walk(c)}};
  walk(p);return o}
async function docxToText(file){
  if(!window.JSZip)throw new Error("JSZip kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang.");
  const z=await JSZip.loadAsync(await file.arrayBuffer());
  const f=z.file('word/document.xml');if(!f)throw new Error("Bu Word (.docx) fayl emas");
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error("Faylni o'qib bo'lmadi");
  const body=doc.getElementsByTagNameNS(NS_W,'body')[0];
  if(!body)throw new Error("Fayl ichida matn topilmadi");
  return [...body.getElementsByTagNameNS(NS_W,'p')].map(paraText).join('\n')}

/* ---------- Test matnini savollarga ajratish ---------- */
function parseTest(t,key){const ansm={};const am=t.match(/javoblar\s*:?([\s\S]*)$/i);let ks=null;
  if(am){ks=am[1];t=t.slice(0,am.index)}else if(key&&key.trim())ks=key;
  if(ks){for(const m of ks.matchAll(/(\d+)\s*[-.):]?\s*([A-Da-d])/g))ansm[+m[1]]='ABCD'.indexOf(m[2].toUpperCase())}
  const qs=[];
  for(const b of t.split(/\n\s*(?=\d+\s*[.)]\s)/)){const m=b.trim().match(/^(\d+)\s*[.)]\s*([\s\S]*)$/);if(!m)continue;
    const body=m[2],ix=[];let pos=0;
    for(let k=0;k<4;k++){const mm=new RegExp('(^|\\s)'+'ABCD'[k]+'\\)\\s*').exec(body.slice(pos));if(!mm)break;ix.push([pos+mm.index+mm[1].length,pos+mm.index+mm[0].length]);pos+=mm.index+mm[0].length}
    if(ix.length<4)continue;
    const raws=ix.map((x,k)=>body.slice(x[1],k<3?ix[k+1][0]:undefined));
    qs.push({n:+m[1],q:body.slice(0,ix[0][0]).trim().replace(/\n{3,}/g,'\n\n'),o:raws.map((r,k)=>{const s=r.trim();return (k>0&&/\n\s*$/.test(raws[k-1]))?'\n'+s:s})})}
  return {qs,ansm}}

  el.innerHTML='<h2 style="margin:18px 4px 0">👁 O\'quvchida shunday ko\'rinadi <small>(yashil doira = to\'g\'ri javob)</small></h2>'+qs.map((q,i)=>qBlock(q,i,true,ansm[q.n])).join('');
  kx(el)}
async function readTestFile(inp){
  const f=inp.files[0];if(!f)return;
  tfm.textContent="Fayl o'qilmoqda...";
  try{let t='';
    if(/\.docx$/i.test(f.name))t=await docxToText(f);
    else if(/\.txt$/i.test(f.name))t=await f.text();
    else{tfm.textContent="Faqat .docx yoki .txt fayl tanlang (eski .doc ishlamaydi).";return}
    tx.value=t.replace(/\r/g,'').replace(/\u00a0/g,' ').trim();
    if(!tn.value.trim())tn.value=f.name.replace(/\.[^.]+$/,'');
    previewTest();
    if(!tx.value)tfm.textContent="Faylda matn topilmadi"
  }catch(e){tfm.textContent='Xato: '+e.message}}

  if(k.error){alert('Xato: '+k.error.message);return}
  await load();render();alert(qs.length+" ta savol saqlandi")}
function chTime(id,m){const v=prompt("Yangi vaqt (daqiqa):",m);const n=parseInt(v);if(!n||n<1)return;act(sb.from('tests').update({minutes:n}).eq('id',id))}
/* ---------- TESTNI TAHRIRLASH ---------- */
let E=null,ept={};
async function eOpen(id){
  const t=D.te.find(x=>x.id===id);if(!t)return;
  const k=await sb.from('test_keys').select('ans').eq('test_id',id).maybeSingle();
  if(k.error){alert("Javoblarni o'qib bo'lmadi: "+k.error.message);return}
  const a=(k.data&&k.data.ans)||[];
  E={id:t.id,title:t.title,minutes:t.minutes,video_id:t.video_id,
    qs:t.qs.map(q=>({q:q.q,o:q.o.map(x=>x.replace(/^\n/,'')),nl:q.o.map(x=>x.charAt(0)==='\n')})),
    ans:t.qs.map((_,i)=>(a[i]!=null?a[i]:null))};
  tab='edit';render();window.scrollTo(0,0)}
const eq=i=>({q:E.qs[i].q,o:E.qs[i].o.map((t,k)=>(E.qs[i].nl[k]?'\n':'')+t)});
function epv(i){const el=document.getElementById('epv'+i);if(!el)return;
  const q=eq(i);el.innerHTML='<div class="qt"><b>'+(i+1)+'.</b> '+H(q.q)+'</div>'+optsHtml(q);kx(el)}
function ePreviewAll(){if(E)E.qs.forEach((_,i)=>epv(i))}
function eSoon(i){clearTimeout(ept[i]);ept[i]=setTimeout(()=>epv(i),400)}
function eQ(i,v){E.qs[i].q=v;eSoon(i)}
function eO(i,k,v){E.qs[i].o[k]=v;eSoon(i)}
function eA(i,j){E.ans[i]=j;[0,1,2,3].forEach(k=>{const b=document.getElementById('ea'+i+'_'+k);if(b)b.classList.toggle('sel',k===j)})}
function eMeta(){E.title=document.getElementById('etn').value;E.minutes=document.getElementById('etm').value;E.video_id=document.getElementById('etv').value}
function eAdd(){eMeta();E.qs.push({q:'',o:['','','',''],nl:[false,false,false,false]});E.ans.push(null);render();
  setTimeout(()=>{const el=document.getElementById('eq'+(E.qs.length-1));if(el)el.scrollIntoView()},50)}
function eDel(i){if(!confirm((i+1)+"-savol o'chirilsinmi?"))return;eMeta();E.qs.splice(i,1);E.ans.splice(i,1);render()}
function editorHtml(){
  return `<div class="c"><button class="g" onclick="tab='tests';render()">← Testlarga qaytish</button><h2 style="margin-top:14px">Testni tahrirlash</h2>
  <small>Test nomi:</small><input id="etn" value="${esc(E.title)}">
  <small>⏱ Vaqt (daqiqa):</small><input id="etm" type="number" min="1" value="${esc(E.minutes)}">
  <small>Qaysi videoga bog'langan:</small><select id="etv">${D.v.map(v=>`<option value="${v.id}" ${v.id===E.video_id?'selected':''}>${esc(v.title)}</option>`).join('')}</select>
  <p><small>Formulalar <b>$ ... $</b> belgisi ichida turadi (ularga tegmang). Har bir savol ostida o'quvchida qanday ko'rinishi chiqadi. To'g'ri javobni doirani bosib belgilang. Oxirida <b>Saqlash</b> ni bosing.</small></p></div>`+
  E.qs.map((q,i)=>`<div class="c" id="eq${i}"><h2>${i+1}-savol <button class="r" style="float:right;margin:0;padding:4px 10px" onclick="eDel(${i})">✕ O'chirish</button></h2>
   <textarea style="min-height:90px" oninput="eQ(${i},this.value)" placeholder="Savol matni">${esc(q.q)}</textarea>
   ${q.o.map((t,k)=>`<input value="${esc(t)}" placeholder="${'ABCD'[k]} varianti" oninput="eO(${i},${k},this.value)">`).join('')}
   <small>To'g'ri javob:</small><div class="ob">${[0,1,2,3].map(j=>`<button type="button" id="ea${i}_${j}" class="${E.ans[i]===j?'sel':''}" onclick="eA(${i},${j})">${'ABCD'[j]}</button>`).join('')}</div>
   <div class="epv" id="epv${i}"></div></div>`).join('')+
  `<div class="c"><button class="g" onclick="eAdd()">+ Savol qo'shish</button><button onclick="eSave()">💾 Saqlash</button><p id="emsg" class="no"></p></div>`}
async function eSave(){eMeta();const m=document.getElementById('emsg');
  const mn=parseInt(E.minutes);
  if(!E.title.trim()){m.textContent='Test nomini yozing';return}
  if(!mn||mn<1){m.textContent='Vaqtni (daqiqa) kiriting';return}
  if(!E.qs.length){m.textContent="Kamida bitta savol bo'lsin";return}
  for(let i=0;i<E.qs.length;i++){const q=E.qs[i];
    if(!q.q.trim()){m.textContent=(i+1)+"-savol matni bo'sh";return}
    const k=q.o.findIndex(t=>!t.trim());if(k>=0){m.textContent=(i+1)+"-savolda "+'ABCD'[k]+" varianti bo'sh";return}
    if(E.ans[i]==null){m.textContent=(i+1)+"-savolning to'g'ri javobi belgilanmagan";return}}
  if(D.rr.some(r=>r.test_id===E.id)&&!confirm("Bu testni o'quvchilar ishlagan. Savollarni o'zgartirsangiz, eski natijalar eski savollarga tegishli bo'lib qoladi. Davom etasizmi?"))return;
  m.textContent='Saqlanmoqda...';
  const qs=E.qs.map(x=>({q:x.q.trim(),o:x.o.map((t,k)=>(x.nl[k]?'\n':'')+t.trim())}));
  const r1=await sb.from('tests').update({title:E.title.trim(),minutes:mn,video_id:E.video_id,qs}).eq('id',E.id);
  if(r1.error){m.textContent='Xato: '+r1.error.message;return}
  const u=await sb.from('test_keys').update({ans:E.ans}).eq('test_id',E.id).select();
  if(u.error){m.textContent='Xato: '+u.error.message;return}
  if(!u.data||!u.data.length){const i2=await sb.from('test_keys').insert({test_id:E.id,ans:E.ans});if(i2.error){m.textContent='Xato: '+i2.error.message;return}}
  await load();tab='tests';render();alert('Saqlandi')}
async function delTest(id){const n=D.rr.filter(r=>r.test_id===id).length;
  if(!confirm("Test o'chirilsinmi?"+(n?" Uning "+n+" ta natijasi ham o'chadi.":"")))return;
  if(n){const a=await sb.from('test_results').delete().eq('test_id',id);if(a.error){alert('Xato: '+a.error.message);return}}
  await sb.from('test_keys').delete().eq('test_id',id);
  act(sb.from('tests').delete().eq('id',id))}
function testsHtml(){
  let h=`<div class="c"><h2>Yangi test</h2><select id="tv">${D.v.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('')}</select><input id="tn" placeholder="Test nomi">
  <small>⏱ <b>Test vaqti (daqiqa).</b> O'quvchi «Boshlash» ni bosgandan keyin shu vaqt hisoblanadi.</small><input id="tm2" type="number" min="1" placeholder="Masalan: 30" value="30">
  <h2 style="margin-top:16px">📄 Word (.docx) fayldan yuklash</h2><small>Faylni tanlang: matn ham, formulalar ham o'qiladi. Savollar <b>1. ... A) ... B) ... C) ... D) ...</b> ko'rinishida bo'lishi kerak.</small><input id="tfi" type="file" accept=".docx,.txt" onchange="readTestFile(this)"><p id="tfm"><small></small></p>
  <small>✅ <b>To'g'ri javoblar</b> (faylda «Javoblar: ...» qatori bo'lmasa, shu yerga yozing):</small><input id="tak" placeholder="Masalan: 1C 2B 3A 4D" oninput="previewSoon()">
  <h2 style="margin-top:16px">✍️ Fayldan o'qilgan matn <small>(formulalar $ belgisi ichida; xohlasangiz o'zingiz ham joylashingiz mumkin)</small></h2><textarea id="tx" style="min-height:160px" oninput="previewSoon()"></textarea>
  <button class="g" onclick="previewTest()">Ko'rib chiqish</button><button onclick="saveTest()">Testni saqlash</button><p id="tmsg" class="no"></p></div><div id="tpv"></div>`;
  h+=`<div class="c"><h2>Testlar</h2>`+(D.te.length?D.te.map(t=>`<div class="row"><b>${esc(t.title)}</b> · ${esc(vt(t.video_id))}<br><small>${t.minutes} daqiqa · ${t.qs.length} savol</small><br><button onclick="eOpen('${t.id}')">✏️ Tahrirlash</button><button class="g" onclick="chTime('${t.id}',${t.minutes})">⏱ Vaqt</button><button class="r" onclick="delTest('${t.id}')">O'chirish</button></div>`).join(''):"<small>Hali test yo'q</small>")+`</div>`;
  return h+`<div class="c"><h2>Natijalar</h2>`+(D.rr.length?D.rr.map(r=>`<div class="row"><b>${esc(r.student_name||'Ismsiz')}</b> — ${r.score}/${r.total} <small>${fmt(r.created_at)}</small><br><small>Xato savollar: ${r.wrong.length?r.wrong.join(', '):"yo'q"}</small></div>`).join(''):"<small>Hali natija yo'q</small>")+`</div>`}
function qsHtml(){return `<div class="c"><h2>O'quvchi savollari</h2>`+(D.qq.length?D.qq.map(q=>`<div class="row"><b>${esc(q.student_name||'Ismsiz')}</b> · ${esc(vt(q.video_id))} <small>${fmt(q.created_at)}</small><br>${esc(q.text)}<br><small>Aloqa: ${esc(q.contact||'-')}</small><br><button class="g" onclick="act(sb.from('questions').update({done:${!q.done}}).eq('id','${q.id}'))">${q.done?'✓ Javob berilgan':'Javob berildi'}</button><button class="r" onclick="act(sb.from('questions').delete().eq('id','${q.id}'))">O'chirish</button></div>`).join(''):"<small>Hali savol yo'q</small>")+`</div>`}
/* ---------- O'QUVCHI HISOBI ---------- */
const S=()=>{try{return JSON.parse(localStorage.getItem('stu'))}catch(e){return null}};
const testRow=r=>{const wa=r.wrong.length;return `<div class="row"><b>${esc(r.t)}</b> <small>${esc(r.v||'')} · ${fmt(r.at)}</small><br><span class="ok">${r.score} to'g'ri</span> · <span class="no">${r.total-r.score} xato</span> <small>(${r.total} ta, ${r.total?Math.round(r.score*100/r.total):0}%)</small>${wa?'<br><small>Xato savollar:</small> '+r.wrong.map(x=>'<span class="wl">'+x+'</span>').join(''):''}</div>`};
async function home(){const s=S(),el=document.getElementById('me');
  if(!s){el.innerHTML=`<div class="c"><h2>O'quvchi kirishi</h2><input id="si" placeholder="ID raqam"><input id="sp" type="password" placeholder="Parol"><button onclick="slogin()">Kirish</button><p id="sm" class="no"></p></div>`+contactHtml(await getContacts());return}
  const [res,ct]=await Promise.all([sb.rpc('my_data',{p_sid:s.s,p_pin:s.p}),getContacts()]);
  const d=res.data;
  if(res.error||!d){localStorage.removeItem('stu');home();return}
  const n=d.tests.length,avg=n?Math.round(d.tests.reduce((a,r)=>a+(r.total?r.score*100/r.total:0),0)/n):0;
  el.innerHTML=`<div class="c"><h2><span class="av">${esc((d.name||'?').trim().charAt(0).toUpperCase())}</span>${esc(d.name)} <small>ID ${esc(s.s)}</small></h2><div class="st3"><div class="sx"><b>${n}</b><small>ishlangan test</small></div><div class="sx g1"><b>${avg}%</b><small>o'rtacha natija</small></div><div class="sx"><b>${d.videos.length}</b><small>ko'rgan video</small></div></div><button class="g" onclick="localStorage.removeItem('stu');student()">Chiqish</button></div>`+contactHtml(ct)+`<div class="c"><h2>Testlarim</h2>${n?d.tests.map(testRow).join(''):"<small>Hali test ishlanmagan</small>"}</div><div class="c"><h2>Ko'rgan videolarim</h2>${d.videos.length?d.videos.map(x=>`<div class="row">${esc(x.v)} <small>${fmt(x.at)}</small></div>`).join(''):"<small>Hali video ko'rilmagan</small>"}</div>`}
async function slogin(){localStorage.setItem('stu',JSON.stringify({s:si.value.trim(),p:sp.value.trim()}));
  const s=S(),{error}=await sb.rpc('my_data',{p_sid:s.s,p_pin:s.p});
  if(error){localStorage.removeItem('stu');sm.textContent="ID yoki parol noto'g'ri";return}home()}
let SO=null;
function stuOne(id){SO=id;tab='stuone';render();window.scrollTo(0,0)}
function stuOneHtml(){const s=D.ss.find(x=>x.id===SO);if(!s)return `<div class="c"><button class="g" onclick="tab='stu';render()">← O'quvchilarga qaytish</button></div>`;
  const r=D.rr.filter(x=>x.student_id===s.id),l=D.l.filter(x=>x.student_id===s.id);
  const avg=r.length?Math.round(r.reduce((a,x)=>a+(x.total?x.score*100/x.total:0),0)/r.length):0;
  return `<div class="c"><button class="g" onclick="tab='stu';render()">← O'quvchilarga qaytish</button><h2 style="margin-top:14px"><span class="av">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</span>${esc(s.name)}</h2><p>ID: <b>${esc(s.sid)}</b> · Parol: <b>${esc(s.pin)}</b></p><div class="st3"><div class="sx"><b>${r.length}</b><small>ishlangan test</small></div><div class="sx g1"><b>${avg}%</b><small>o'rtacha natija</small></div><div class="sx"><b>${l.length}</b><small>ko'rgan video</small></div></div></div>
  <div class="c"><h2>Testlari</h2>${r.length?r.map(x=>testRow({t:(D.te.find(t=>t.id===x.test_id)||{}).title||'Test',v:vt((D.te.find(t=>t.id===x.test_id)||{}).video_id),at:x.created_at,score:x.score,total:x.total,wrong:x.wrong||[]})).join(''):"<small>Hali test ishlamagan</small>"}</div>
  <div class="c"><h2>Ko'rgan videolari</h2>${l.length?l.map(x=>`<div class="row">${esc(vt(x.video_id))} <small>${fmt(x.started_at)}</small></div>`).join(''):"<small>Hali video ko'rmagan</small>"}</div>`}
function stuHtml(){const nx=D.ss.reduce((m,s)=>Math.max(m,parseInt(s.sid)||0),0)+1;
  return `<div class="c"><h2>Yangi o'quvchi</h2><input id="ni" value="${nx}" placeholder="ID raqam"><input id="nn" placeholder="Ism familiya"><input id="np2" placeholder="Parol (bo'sh qolsa avtomatik)"><button onclick="addStu()">Qo'shish</button></div><div class="c"><h2>O'quvchilar (${D.ss.length})</h2>`+(D.ss.length?D.ss.map(s=>{const r=D.rr.filter(x=>x.student_id===s.id),l=D.l.filter(x=>x.student_id===s.id);
    return `<div class="row"><b>${esc(s.name)}</b><br>ID: <b>${esc(s.sid)}</b> · Parol: <b>${esc(s.pin)}</b><br><small>Testlar: ${r.length} · Ko'rgan videolar: ${l.length}</small><br>${r.map(x=>`<small>${esc((D.te.find(t=>t.id===x.test_id)||{}).title||'')}: ${x.score}/${x.total}, xato: ${x.wrong.join(',')||'-'}</small>`).join('<br>')}<br><button onclick="stuOne('${s.id}')">📄 Sahifasi</button><button class="r" onclick="delStu('${s.id}')">O'chirish</button></div>`}).join(''):"<small>Hali o'quvchi yo'q</small>")+`</div>`}
function addStu(){if(!ni.value.trim()||!nn.value.trim())return;act(sb.from('students').insert({sid:ni.value.trim(),name:nn.value.trim(),pin:np2.value.trim()||String(Math.floor(1000+Math.random()*9000))}))}
function delStu(id){if(confirm("O'quvchi o'chirilsinmi?"))act(sb.from('students').delete().eq('id',id))}
route();
</script></body></html>
