<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematika EDU</title>
<style>
:root{--bg:#f3f8f4;--card:#fff;--line:#dcebdf;--text:#1b2e23;--mute:#5f7a6a;--acc:#1f8a4c;--acc-d:#166a3a;--soft:#e6f3ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.w{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:25px;font-weight:700;margin:8px 0 16px;color:var(--acc-d)}
h2{font-size:16px;font-weight:600;margin:0 0 12px;color:var(--text)}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #1f8a4c0d}
input,select,textarea{width:100%;padding:13px 14px;margin:5px 0;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fbfefc;color:var(--text);outline:none;font-family:inherit}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #1f8a4c20}
button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;margin:6px 6px 0 0;font-family:inherit;cursor:pointer}
button:active{background:var(--acc-d)}
button.g{background:var(--soft);color:var(--acc-d)}
button.r{background:#fff;color:#c0392b;border:1.5px solid #f2d2cd}
.t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.t button{border-radius:999px;margin:0}
.row{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.row:first-of-type{border-top:0}
.ok{color:var(--acc);font-weight:600}.no{color:#c0392b}
.big{font-size:26px;letter-spacing:3px;font-weight:700}
.v{position:relative;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:var(--acc);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
small{color:var(--mute)}
.op{display:block;padding:10px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}.op:has(input:checked){border-color:var(--acc);background:var(--soft)}.op input{width:auto;margin:0 6px 0 0;padding:0}.good{background:#d7f0e0!important;border-color:var(--acc)!important}.wrongo{background:#fdeceb!important;border-color:#e6a69f!important}.bad{border-color:#e6a69f}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://xhwzmzvrnfnrfvfcydbd.supabase.co","sb_publishable_f61-IFzOxM17Yp1K1yF8lg_H4HGOZD5");
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ytId=u=>{u=(u||'').trim();const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null)};
const gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const fmt=d=>d?new Date(d).toLocaleString('uz'):'';
let tab='videos',D={};

function route(){location.hash==='#admin'?admin():student()}
window.onhashchange=route;

/* ---------- O'QUVCHI ---------- */
function student(){
  const cur=sessionStorage.getItem('cur');
  if(cur){const v=JSON.parse(cur);
    app.innerHTML=`<h1>${esc(v.t)}</h1><div class="c"><div class="v"><iframe src="https://www.youtube-nocookie.com/embed/${v.y}?rel=0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>
    <p><small>Bu kod bir martalik edi. Sahifani yopsangiz, qayta ko'rish uchun yangi kod kerak bo'ladi.</small></p>
    <button class="g" onclick="sessionStorage.removeItem('cur');student()">Chiqish</button></div><div id="ex"></div>`;extras(v);return}
  app.innerHTML=`<h1 style="margin-top:40px">Matematika EDU</h1><div class="c"><h2>Videoni ochish uchun kodni kiriting</h2>
  <input id="code" placeholder="Ustozdan olgan kodni kiriting" autocapitalize="characters">
  <button onclick="redeem()">Ko'rish</button><p id="msg" class="no"></p></div>
  <p><small><a href="#admin">Ustoz kirishi</a></small></p><div id="me"></div>`;home();
}
async function redeem(){
  const code=document.getElementById('code').value.trim();
  const {data,error}=await sb.rpc('redeem_code',{p_code:code,p_sid:(S()||{}).s||null,p_pin:(S()||{}).p||null});
  if(error||!data||!data.length){document.getElementById('msg').textContent="Kod noto'g'ri yoki ishlatilgan.";return}
  sessionStorage.setItem('cur',JSON.stringify({t:data[0].vtitle,y:data[0].vyid,i:data[0].vid,n:data[0].sname}));student();
}

/* ---------- ADMIN ---------- */
async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    app.innerHTML=`<h1>Ustoz kabineti</h1><div class="c"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Parol">
    <button onclick="login()">Kirish</button><p id="msg" class="no"></p></div><a href="#">← Orqaga</a>`;return}

  const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
  if(error){msg.textContent="Email yoki parol xato";return}admin();
}
async function logout(){await sb.auth.signOut();admin()}
async function load(){
  const [f,v,c,l,fl]=await Promise.all([
    sb.from('folders').select('*').order('created_at'),
    sb.from('videos').select('*').order('created_at'),
    sb.from('access_codes').select('*').order('created_at',{ascending:false}),
    sb.from('views_log').select('*').order('started_at',{ascending:false}),
    sb.from('files').select('*').order('created_at',{ascending:false})]);
  const [ss,te,qq,rr]=await Promise.all([sb.from('students').select('*').order('created_at',{ascending:false}),sb.from('tests').select('*').order('created_at',{ascending:false}),sb.from('questions').select('*').order('created_at',{ascending:false}),sb.from('test_results').select('*').order('created_at',{ascending:false})]);D={ss:ss.data||[],te:te.data||[],qq:qq.data||[],rr:rr.data||[],f:f.data||[],v:v.data||[],c:c.data||[],l:l.data||[],fl:fl.data||[]};
}
const vt=id=>(D.v.find(x=>x.id===id)||{}).title||'?';
function render(){
  const tabs=[['videos','Videolar'],['codes','Kodlar'],['files','Fayllar'],['stats','Statistika'],['acc','Hisob'],['tests','Testlar'],['qs','Savollar'],['stu',"O'quvchilar"]];
  let h=`<h1>Ustoz kabineti</h1><div class="t">${tabs.map(t=>`<button class="${tab===t[0]?'':'g'}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
  if(tab==='videos'){
    h+=`<div class="c"><h2>Yangi papka</h2><input id="fn" placeholder="Papka nomi (masalan: Algebra 9-sinf)"><button onclick="addFolder()">Papka qo'shish</button></div>
    <div class="c"><h2>Video qo'shish</h2><input id="vtt" placeholder="Video nomi"><input id="vl" placeholder="YouTube havolasi"><select id="vf"><option value="">Papkasiz</option>${D.f.filter(x=>x.type!=='file').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="addVideo()">Qo'shish</button></div>`;
    h+=`<div class="c"><h2>Ko'p video qo'shish</h2><small>Har qatorga bitta: <b>havola</b> yoki <b>Nomi | havola</b>. Nom yozilmasa, YouTube'dan o'zi olinadi.</small><textarea id="bt" placeholder="https://youtu.be/xxxxxxxxxxx&#10;1-dars | https://youtu.be/yyyyyyyyyyy"></textarea><select id="bf"><option value="">Papkasiz</option>${D.f.filter(x=>x.type!=='file').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button onclick="bulkAdd()">Hammasini qo'shish</button><p id="bmsg"><small></small></p></div>`;
    const groups=[...D.f.filter(f=>f.type!=='file').map(f=>[f.id,f.name]),['','Papkasiz']];
    groups.forEach(([fid,fname])=>{const vs=D.v.filter(v=>(v.folder_id||'')===fid);if(!vs.length&&!fid)return;
      h+=`<div class="c"><h2>📁 ${esc(fname)} ${fid?`<button class="r" style="padding:4px 10px;float:right;margin:0" onclick="delFolder('${fid}')">✕</button>`:''}</h2>`+
      (vs.length?vs.map(v=>`<div class="row"><b>${esc(v.title)}</b><br><button onclick="mkCode('${v.id}')">+ Kod</button><button class="g" onclick="repl('${v.id}')">Almashtirish</button><button class="r" onclick="delVideo('${v.id}')">O'chirish</button></div>`).join(''):'<small>Bo\'sh</small>')+`</div>`});
  }
  if(tab==='codes'){
    h+=`<div class="c"><h2>Kodlar</h2>`+(D.c.length?D.c.map(c=>`<div class="row"><span class="big" style="font-size:18px">${c.code}</span> <span class="${c.used?'no':'ok'}">${c.used?'ishlatilgan '+fmt(c.used_at):'ishlatilmagan'}</span><br>${esc(vt(c.video_id))}${c.student_name?' · '+esc(c.student_name):''}<br><button class="g" onclick="delCode('${c.id}')">O'chirish</button></div>`).join(''):'<small>Hali kod yo\'q. Videolar bo\'limida "+ Kod" bosing.</small>')+`</div>`;
  }
  if(tab==='stats'){
    h+=`<div class="c"><h2>Kim nimani ko'rgan</h2>`+(D.l.length?D.l.map(l=>`<div class="row"><b>${esc(l.student_name||'Ismsiz')}</b> — ${esc(vt(l.video_id))}<br><small>${fmt(l.started_at)}</small></div>`).join(''):'<small>Hali ko\'rish yo\'q.</small>')+`</div>
    <div class="c"><h2>Videolar bo'yicha</h2>${D.v.map(v=>`<div class="row">${esc(v.title)}: <b>${D.l.filter(l=>l.video_id===v.id).length}</b> marta</div>`).join('')}</div>`;
  }
  if(tab==='acc'){
    h+=`<div class="c"><h2>Login (email) o'zgartirish</h2><input id="ne" type="email" placeholder="Yangi email"><button onclick="upd({email:ne.value})">Saqlash</button></div>
    <div class="c"><h2>Parol o'zgartirish</h2><input id="np" type="password" placeholder="Yangi parol (8+ belgi)"><button onclick="upd({password:np.value})">Saqlash</button></div>
    <button class="r" onclick="logout()">Chiqish</button>`;
  }
  if(tab==='files'){
    const ff=D.f.filter(x=>x.type==='file');
    h+=`<div class="c"><h2>Yangi fayl papkasi</h2><input id="ffn" placeholder="Papka nomi (masalan: Testlar 9-sinf)"><button onclick="addFFolder()">Papka qo'shish</button></div>
    <div class="c"><h2>Fayl yuklash</h2><input id="ft" placeholder="Nomi (ixtiyoriy)"><select id="fk"><option value="file">Fayl</option><option value="test">Test</option></select><select id="ffo"><option value="">Papkasiz</option>${ff.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input id="fi" type="file"><button onclick="upFile()">Yuklash</button><p id="fmsg"><small>Bitta fayl 50 MB gacha.</small></p></div>`;
    [...ff.map(f=>[f.id,f.name]),['','Papkasiz']].forEach(([fid,fname])=>{const xs=D.fl.filter(x=>(x.folder_id||'')===fid);if(!xs.length&&!fid)return;
      h+=`<div class="c"><h2>📁 ${esc(fname)} ${fid?`<button class="r" style="padding:4px 10px;float:right;margin:0" onclick="delFolder('${fid}')">✕</button>`:''}</h2>`+
      (xs.length?xs.map(x=>`<div class="row"><b>${esc(x.title)}</b> <small>${x.kind==='test'?'Test':'Fayl'} · ${fmt(x.created_at)}</small><br><button onclick="openFile('${x.id}')">Ochish</button><button class="g" onclick="replFile('${x.id}')">Almashtirish</button><button class="r" onclick="delFile('${x.id}')">O'chirish</button></div>`).join(''):'<small>Bo\'sh</small>')+`</div>`});
  }
  if(tab==='tests')h+=testsHtml();if(tab==='qs')h+=qsHtml();if(tab==='stu')h+=stuHtml();app.innerHTML=h+`<p><a href="#">Talaba sahifasi</a></p>`;
}
async function act(p){const {error}=await p;if(error)alert('Xato: '+error.message);await load();render()}
function addFolder(){if(!fn.value.trim())return;act(sb.from('folders').insert({name:fn.value.trim()}))}
function delFolder(id){if(confirm("Papka o'chirilsinmi? Videolar papkasiz qoladi."))act(sb.from('folders').delete().eq('id',id))}
function addVideo(){const y=ytId(vl.value);if(!vtt.value.trim()||!y){alert("Nom va to'g'ri YouTube havolasini kiriting");return}
  act(sb.from('videos').insert({title:vtt.value.trim(),youtube_id:y,folder_id:vf.value||null}))}
function repl(id){const u=prompt("Yangi YouTube havolasi:");const y=ytId(u);if(!y){alert("Havola noto'g'ri");return}act(sb.from('videos').update({youtube_id:y}).eq('id',id))}
function delVideo(id){if(confirm("Video o'chirilsinmi?"))act(sb.from('videos').delete().eq('id',id))}
async function mkCode(vid){const n=prompt("O'quvchi ismi (ixtiyoriy):")??null;if(n===null&&!confirm("Ismsiz kod yaratilsinmi?"))return;
  const code=gen();const {error}=await sb.from('access_codes').insert({video_id:vid,code,student_name:n||null});
  if(error){alert('Xato: '+error.message);return}await load();tab='codes';render();alert('Kod: '+code)}
function delCode(id){act(sb.from('access_codes').delete().eq('id',id))}
async function upd(o){const {error}=await sb.auth.updateUser(o);alert(error?'Xato: '+error.message:'Saqlandi')}
function addFFolder(){if(!ffn.value.trim())return;act(sb.from('folders').insert({name:ffn.value.trim(),type:'file'}))}
const safe=n=>n.replace(/[^\w.\-]+/g,'_');
async function upFile(){const f=fi.files[0];if(!f){alert('Fayl tanlang');return}
  fmsg.textContent='Yuklanmoqda...';
  const path=crypto.randomUUID()+'/'+safe(f.name);
  const {error}=await sb.storage.from('files').upload(path,f);
  if(error){fmsg.textContent='Xato: '+error.message;return}
  await act(sb.from('files').insert({title:ft.value.trim()||f.name,file_url:path,kind:fk.value,folder_id:ffo.value||null}))}
async function openFile(id){const x=D.fl.find(a=>a.id===id);const w=window.open('','_blank');
  const {data,error}=await sb.storage.from('files').createSignedUrl(x.file_url,3600);
  if(error){if(w)w.close();alert('Xato: '+error.message);return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
function replFile(id){const x=D.fl.find(a=>a.id===id);const i=document.createElement('input');i.type='file';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;const path=crypto.randomUUID()+'/'+safe(f.name);
    const u=await sb.storage.from('files').upload(path,f);if(u.error){alert('Xato: '+u.error.message);return}
    await sb.storage.from('files').remove([x.file_url]);
    act(sb.from('files').update({file_url:path}).eq('id',id))};i.click()}
function delFile(id){const x=D.fl.find(a=>a.id===id);if(!confirm("Fayl o'chirilsinmi?"))return;
  sb.storage.from('files').remove([x.file_url]).then(()=>act(sb.from('files').delete().eq('id',id)))}
async function bulkAdd(){
  const have=new Set(D.v.map(v=>v.youtube_id));const items=[];
  for(const L of bt.value.split('\n').map(x=>x.trim()).filter(Boolean)){
    let t='',u=L;const i=L.lastIndexOf('|');if(i>-1){t=L.slice(0,i).trim();u=L.slice(i+1).trim()}
    const y=ytId(u);if(!y||have.has(y))continue;have.add(y);items.push({t,y})}
  if(!items.length){alert("Yangi to'g'ri havola topilmadi");return}
  let done=0;
  for(let k=0;k<items.length;k+=10){
    await Promise.all(items.slice(k,k+10).map(async it=>{
      if(!it.t){try{const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+it.y));it.t=(await r.json()).title||''}catch(e){}}
      done++;bmsg.textContent='Nomlar olinmoqda: '+done+'/'+items.length}))}
  const base=D.v.length;
  const rows=items.map((it,n)=>({title:it.t||('Video '+(base+n+1)),youtube_id:it.y,folder_id:bf.value||null,sort_order:base+n+1}));
  const {error}=await sb.from('videos').insert(rows);
  if(error){alert('Xato: '+error.message);return}
  await load();render();alert(rows.length+" ta video qo'shildi")}
/* ---------- TEST va SAVOL ---------- */
let T,CV,tm,ans={},fin=false;
const kx=el=>{try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}};
const H=s=>esc(s).replace(/\n/g,'<br>');
async function extras(v){CV=v;T=null;
  const {data:t}=await sb.rpc('get_test',{p_video:v.i});let h='';
  if(t&&t.length){T=t[0];h+=`<div class="c"><h2>📝 ${esc(T.title)}</h2><p>${T.qs.length} ta savol · ${T.minutes} daqiqa</p><button onclick="startTest()">Testni boshlash</button></div>`}
  h+=`<div class="c"><h2>Ustozga savol</h2><textarea id="qt" style="min-height:80px" maxlength="1000" placeholder="Savolingizni yozing"></textarea><input id="qc" placeholder="Telegram yoki telefon (javob olish uchun)"><button onclick="askQ()">Yuborish</button><p id="qm"></p></div>`;
  document.getElementById('ex').innerHTML=h}
async function askQ(){const t=qt.value.trim();if(!t)return;
  const {error}=await sb.rpc('ask_question',{p_video:CV.i,p_text:t,p_contact:qc.value.trim(),p_name:CV.n||null});
  qm.textContent=error?'Xato, qayta urinib ko\'ring':'Savol yuborildi ✓';if(!error)qt.value=''}
function startTest(){ans={};fin=false;clearInterval(tm);const end=Date.now()+T.minutes*60000;
  app.innerHTML=`<div class="c" style="position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center"><b>${esc(T.title)}</b><span class="big" id="tt" style="font-size:20px"></span></div><div id="qbox"></div><button onclick="finish()">Yakunlash</button>`;
  document.getElementById('qbox').innerHTML=T.qs.map((q,i)=>`<div class="c"><div><b>${i+1}.</b> ${H(q.q)}</div>${q.o.map((o,j)=>`<label class="op"><input type="radio" name="r${i}" onchange="ans[${i}]=${j}"><b>${'ABCD'[j]})</b> ${H(o)}</label>`).join('')}</div>`).join('');
  kx(app);window.scrollTo(0,0);
  const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));tt.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0)finish()};tick();tm=setInterval(tick,500)}
async function finish(){if(fin)return;fin=true;clearInterval(tm);
  const a=T.qs.map((_,i)=>ans[i]??-1);
  const {data:r,error}=await sb.rpc('grade_test',{p_test:T.id,p_answers:a,p_name:CV.n||null,p_sid:(S()||{}).s||null,p_pin:(S()||{}).p||null});
  if(error){alert('Xato: '+error.message);return}
  const w=r.ok.filter(x=>!x).length;
  let h=`<h1>Natija</h1><div class="c"><div class="big">${r.score} / ${a.length}</div><p>${Math.round(r.score*100/a.length)}% · xato: <b>${w}</b> ta</p><div class="t">${r.ok.map((o,i)=>`<button style="width:40px;height:40px;padding:0;border-radius:50%;${o?'background:#d7f0e0;color:#166a3a':'background:#fdeceb;color:#c0392b'}" onclick="document.getElementById('q${i}').scrollIntoView()">${i+1}</button>`).join('')}</div><button class="g" onclick="student()">Videoga qaytish</button><button class="g" onclick="startTest()">Qayta ishlash</button></div>`;
  h+=T.qs.map((q,i)=>`<div class="c ${r.ok[i]?'':'bad'}" id="q${i}"><div><b>${i+1}.</b> ${H(q.q)} ${r.ok[i]?'✅':'❌'}</div>${q.o.map((o,j)=>`<div class="op ${r.c[i]===j?'good':''} ${a[i]===j&&r.c[i]!==j?'wrongo':''}"><b>${'ABCD'[j]})</b> ${H(o)} ${a[i]===j?'<small>← sizning javobingiz</small>':''}</div>`).join('')}${a[i]<0?'<small>Javob berilmagan</small>':''}</div>`).join('');
  app.innerHTML=h;kx(app);window.scrollTo(0,0)}
function parseTest(t){const ansm={};const am=t.match(/javoblar\s*:?([\s\S]*)$/i);
  if(am){for(const m of am[1].matchAll(/(\d+)\s*[-.):]?\s*([A-Da-d])/g))ansm[+m[1]]='ABCD'.indexOf(m[2].toUpperCase());t=t.slice(0,am.index)}
  const qs=[];
  for(const b of t.split(/\n\s*(?=\d+\s*[.)]\s)/)){const m=b.trim().match(/^(\d+)\s*[.)]\s*([\s\S]*)$/);if(!m)continue;
    const body=m[2],ix=[];let pos=0;
    for(let k=0;k<4;k++){const mm=new RegExp('(^|\\s)'+'ABCD'[k]+'\\)\\s*').exec(body.slice(pos));if(!mm)break;ix.push([pos+mm.index+mm[1].length,pos+mm.index+mm[0].length]);pos+=mm.index+mm[0].length}
    if(ix.length<4)continue;
    qs.push({n:+m[1],q:body.slice(0,ix[0][0]).trim(),o:ix.map((x,k)=>body.slice(x[1],k<3?ix[k+1][0]:undefined).trim())})}
  return {qs,ansm}}
async function saveTest(){const {qs,ansm}=parseTest(tx.value);
  if(!qs.length){tmsg.textContent='Savollar topilmadi';return}
  const miss=qs.filter(q=>!(q.n in ansm)).map(q=>q.n);
  if(miss.length){tmsg.textContent="Javobi yo'q: "+miss.join(', ');return}
  const {data,error}=await sb.from('tests').insert({video_id:tv.value,title:tn.value.trim()||'Test',minutes:+tm2.value||30,qs:qs.map(({q,o})=>({q,o}))}).select().single();
  if(error){alert('Xato: '+error.message);return}
  const k=await sb.from('test_keys').insert({test_id:data.id,ans:qs.map(q=>ansm[q.n])});
  if(k.error){alert('Xato: '+k.error.message);return}
  await load();render();alert(qs.length+" ta savol saqlandi")}
function delTest(id){if(confirm("Test o'chirilsinmi?"))act(sb.from('tests').delete().eq('id',id))}
function testsHtml(){
  let h=`<div class="c"><h2>Yangi test</h2><select id="tv">${D.v.map(v=>`<option value="${v.id}">${esc(v.title)}</option>`).join('')}</select><input id="tn" placeholder="Test nomi"><input id="tm2" type="number" placeholder="Vaqt (daqiqa)" value="30"><small>Savollarni Word'dan joylang. Oxirgi qatorga: <b>Javoblar: 1C 2B 3A ...</b></small><textarea id="tx" style="min-height:220px"></textarea><button onclick="saveTest()">Testni saqlash</button></div>`;
  h+=`<div class="c"><h2>Testlar</h2>`+(D.te.length?D.te.map(t=>`<div class="row"><b>${esc(t.title)}</b> · ${esc(vt(t.video_id))}<br><small>${t.minutes} daqiqa · ${t.qs.length} savol</small><br><button class="r" onclick="delTest('${t.id}')">O'chirish</button></div>`).join(''):"<small>Hali test yo'q</small>")+`</div>`;
  return h+`<div class="c"><h2>Natijalar</h2>`+(D.rr.length?D.rr.map(r=>`<div class="row"><b>${esc(r.student_name||'Ismsiz')}</b> — ${r.score}/${r.total} <small>${fmt(r.created_at)}</small><br><small>Xato savollar: ${r.wrong.length?r.wrong.join(', '):"yo'q"}</small></div>`).join(''):"<small>Hali natija yo'q</small>")+`</div>`}
function qsHtml(){return `<div class="c"><h2>O'quvchi savollari</h2>`+(D.qq.length?D.qq.map(q=>`<div class="row"><b>${esc(q.student_name||'Ismsiz')}</b> · ${esc(vt(q.video_id))} <small>${fmt(q.created_at)}</small><br>${esc(q.text)}<br><small>Aloqa: ${esc(q.contact||'-')}</small><br><button class="g" onclick="act(sb.from('questions').update({done:${!q.done}}).eq('id','${q.id}'))">${q.done?'✓ Javob berilgan':'Javob berildi'}</button><button class="r" onclick="act(sb.from('questions').delete().eq('id','${q.id}'))">O'chirish</button></div>`).join(''):"<small>Hali savol yo'q</small>")+`</div>`}
/* ---------- O'QUVCHI HISOBI ---------- */
const S=()=>{try{return JSON.parse(localStorage.getItem('stu'))}catch(e){return null}};
async function home(){const s=S(),el=document.getElementById('me');
  if(!s){el.innerHTML=`<div class="c"><h2>O'quvchi kirishi</h2><input id="si" placeholder="ID raqam"><input id="sp" type="password" placeholder="Parol"><button onclick="slogin()">Kirish</button><p id="sm" class="no"></p></div>`;return}
  const {data:d,error}=await sb.rpc('my_data',{p_sid:s.s,p_pin:s.p});
  if(error){localStorage.removeItem('stu');home();return}
  el.innerHTML=`<div class="c"><h2>👤 ${esc(d.name)} <small>ID ${esc(s.s)}</small></h2><button class="g" onclick="localStorage.removeItem('stu');student()">Chiqish</button></div><div class="c"><h2>Testlarim</h2>${d.tests.length?d.tests.map(r=>`<div class="row"><b>${esc(r.t)}</b> <small>${esc(r.v||'')} · ${fmt(r.at)}</small><br><span class="ok">${r.score} to'g'ri</span> · <span class="no">${r.total-r.score} xato</span> (${r.total} ta)${r.wrong.length?`<br><small>Xato savollar: ${r.wrong.join(', ')}</small>`:''}</div>`).join(''):"<small>Hali test ishlanmagan</small>"}</div><div class="c"><h2>Ko'rgan videolarim</h2>${d.videos.length?d.videos.map(x=>`<div class="row">${esc(x.v)} <small>${fmt(x.at)}</small></div>`).join(''):"<small>Hali video ko'rilmagan</small>"}</div>`}
async function slogin(){localStorage.setItem('stu',JSON.stringify({s:si.value.trim(),p:sp.value.trim()}));
  const s=S(),{error}=await sb.rpc('my_data',{p_sid:s.s,p_pin:s.p});
  if(error){localStorage.removeItem('stu');sm.textContent="ID yoki parol noto'g'ri";return}home()}
function stuHtml(){const nx=D.ss.reduce((m,s)=>Math.max(m,parseInt(s.sid)||0),0)+1;
  return `<div class="c"><h2>Yangi o'quvchi</h2><input id="ni" value="${nx}" placeholder="ID raqam"><input id="nn" placeholder="Ism familiya"><input id="np2" placeholder="Parol (bo'sh qolsa avtomatik)"><button onclick="addStu()">Qo'shish</button></div><div class="c"><h2>O'quvchilar (${D.ss.length})</h2>`+(D.ss.length?D.ss.map(s=>{const r=D.rr.filter(x=>x.student_id===s.id),l=D.l.filter(x=>x.student_id===s.id);
    return `<div class="row"><b>${esc(s.name)}</b><br>ID: <b>${esc(s.sid)}</b> · Parol: <b>${esc(s.pin)}</b><br><small>Testlar: ${r.length} · Ko'rgan videolar: ${l.length}</small><br>${r.map(x=>`<small>${esc((D.te.find(t=>t.id===x.test_id)||{}).title||'')}: ${x.score}/${x.total}, xato: ${x.wrong.join(',')||'-'}</small>`).join('<br>')}<br><button class="r" onclick="delStu('${s.id}')">O'chirish</button></div>`}).join(''):"<small>Hali o'quvchi yo'q</small>")+`</div>`}
function addStu(){if(!ni.value.trim()||!nn.value.trim())return;act(sb.from('students').insert({sid:ni.value.trim(),name:nn.value.trim(),pin:np2.value.trim()||String(Math.floor(1000+Math.random()*9000))}))}
function delStu(id){if(confirm("O'quvchi o'chirilsinmi?"))act(sb.from('students').delete().eq('id',id))}
route();
